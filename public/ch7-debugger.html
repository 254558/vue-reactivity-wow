<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vue 虚拟节点（Debugger版）</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: system-ui, sans-serif;
      background: #070b09;
      color: #d0e4da;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 20px;
    }

    .box {
      background: #0d1612;
      border: 1px solid #1a2e25;
      border-radius: 12px;
      padding: 40px 48px;
      text-align: center;
      max-width: 600px;
      width: 100%;
    }

    .box h1 { font-size: 1.1rem; margin-bottom: 6px; }
    .box h1 small { display:block; font-size:0.72rem; color:#5e8a76; margin-top:6px; }

    .display-area {
      margin: 24px 0;
      padding: 20px;
      background: #0a100d;
      border: 1px solid #1a2e25;
      border-radius: 8px;
    }

    .tree-vis {
      text-align: left;
      font-family: monospace;
      font-size: 0.72rem;
      line-height: 1.8;
    }

    .tree-line { color:#5e8a76; }
    .tag { color:#10b981; font-weight:700; }
    .prop { color:#f59e0b; }
    .text { color:#f0a85e; }
    .el { color:#60a5fa; }

    .mount-flow {
      display:flex;
      gap:6px;
      justify-content:center;
      flex-wrap:wrap;
      margin: 12px 0;
    }

    .flow-step {
      padding:6px 10px;
      border-radius:6px;
      font-size:0.65rem;
      border:1px solid #1a2e25;
      color:#5e8a76;
      background: rgba(7,11,9,0.5);
      transition:0.3s;
    }

    .flow-step.active {
      border-color:#10b981;
      color:#10b981;
    }

    .flow-step.done {
      border-color:rgba(16,185,129,0.3);
      color:rgba(16,185,129,0.6);
    }

    .btn-group {
      display:flex;
      gap:10px;
      justify-content:center;
      margin-top:20px;
      flex-wrap:wrap;
    }

    button {
      padding:10px 18px;
      border:none;
      border-radius:8px;
      cursor:pointer;
      font-weight:700;
      color:white;
    }

    button:disabled { opacity:0.4; cursor:not-allowed; }

    .btn-setup { background:#6b7280; }
    .btn-vnode { background:#10b981; }
    .btn-mount { background:#7c3aed; }

    .status-box {
      margin-top: 12px;
      font-size: 0.75rem;
      text-align:left;
      font-family: monospace;
    }

    #mountTarget {
      margin-top:10px;
      padding:10px;
      border:1px dashed #1a2e25;
      min-height:40px;
      max-height:160px;
      overflow-y:auto;
    }
  </style>
</head>

<body>
<div class="box">

  <h1>
    Vue 虚拟节点 Debugger
    <small>F12 + 按步骤执行，观察渲染全过程</small>
  </h1>

  <div class="display-area">

    <div class="tree-vis" id="vnodeVis">
      （尚未创建VNode）
    </div>

    <div class="mount-flow">
      <div class="flow-step" id="step-create">create</div>
      <div class="flow-step" id="step-props">props</div>
      <div class="flow-step" id="step-children">children</div>
      <div class="flow-step" id="step-cache">cache</div>
      <div class="flow-step" id="step-append">append</div>
    </div>

    <div id="mountTarget"></div>

  </div>

  <div class="btn-group">
    <button class="btn-setup" onclick="setup()">1. 初始化</button>
    <button class="btn-vnode" onclick="createVNode()" id="vnodeBtn" disabled>2. 创建 VNode</button>
    <button class="btn-mount" onclick="mountVNode()" id="mountBtn" disabled>3. 挂载</button>
  </div>

  <div class="status-box" id="log"></div>

</div>

<script>

/* =========================
   VNode创建
========================= */

function h(type, props, children) {

  debugger // [VNode] h函数入口：开始创建虚拟节点

  const vnode = {
    type,
    props: props || {},
    children: children || [],
    el: null
  }

  debugger // [VNode] 创建完成：结构已生成（尚未挂载DOM）

  return vnode
}

/* =========================
   mount流程
========================= */

function mountElement(vnode, container) {

  debugger // [mount] 进入挂载流程（VNode → DOM）

  /* 1. createElement */
  const el = document.createElement(vnode.type)

  updateStep('create')

  debugger // [create] DOM节点已创建

  /* 2. props */
  const props = vnode.props

  if (props && Object.keys(props).length) {

    debugger // [props] 开始设置属性

    for (const key in props) {
      el.setAttribute(key, props[key])
    }

    debugger // [props] 属性设置完成
  }

  updateStep('props')

  /* 3. children */
  if (typeof vnode.children === 'string') {

    debugger // [children] 文本节点

    el.textContent = vnode.children

  } else if (Array.isArray(vnode.children)) {

    debugger // [children] 递归子节点

    vnode.children.forEach(child => {
      mountElement(child, el)
    })

    debugger // [children] 子节点完成
  }

  updateStep('children')

  /* 4. cache */
  vnode.el = el

  debugger // [cache] vnode.el绑定真实DOM

  updateStep('cache')

  /* 5. append */
  container.appendChild(el)

  updateStep('append')

  debugger // [append] DOM挂载完成
}

/* =========================
   UI流程控制
========================= */

let vnodeTree = null
let container = null

function updateStep(step) {

  const steps = ['create','props','children','cache','append']
  const idx = steps.indexOf(step)

  steps.forEach((s, i) => {
    const el = document.getElementById('step-' + s)

    if (i < idx) el.className = 'flow-step done'
    else if (i === idx) el.className = 'flow-step active'
    else el.className = 'flow-step'
  })
}

/* =========================
   VNode展示
========================= */

function renderVNode(vn, indent=0) {

  const pad = '  '.repeat(indent)

  let html = ''

  html += `<div class="tree-line">
    ${pad}<span class="tag">&lt;${vn.type}&gt;</span>
    ${Object.entries(vn.props || {})
      .map(([k,v])=>`<span class="prop">${k}="${v}"</span>`)
      .join(' ')}
    ${vn.el ? '<span class="el">✓</span>' : ''}
  </div>`

  if (Array.isArray(vn.children)) {
    vn.children.forEach(c => {
      html += renderVNode(c, indent+1)
    })
  } else {
    html += `<div class="tree-line">${pad}  <span class="text">${vn.children}</span></div>`
  }

  return html
}

function updateVNodeView() {
  if (!vnodeTree) return
  document.getElementById('vnodeVis').innerHTML = renderVNode(vnodeTree)
}

/* =========================
   按钮逻辑
========================= */

function setup() {
  container = document.getElementById('mountTarget')
  document.getElementById('vnodeBtn').disabled = false
  log('初始化完成')
}

function createVNode() {

  debugger // [VNode] 开始构建树

  vnodeTree = h('div',
    { id:'app', class:'container' },
    [
      h('p', {}, 'Hello'),
      h('span', { class:'highlight' }, 'Vue')
    ]
  )

  updateVNodeView()

  document.getElementById('mountBtn').disabled = false

  debugger // [VNode] 树创建完成

  log('VNode创建完成')
}

function mountVNode() {

  debugger // [mount] 开始挂载流程

  document.getElementById('mountTarget').innerHTML = ''

  mountElement(vnodeTree, container)

  updateVNodeView()

  debugger // [mount] 完整流程结束

  log('挂载完成')
}

/* =========================
   log
========================= */

function log(msg){
  document.getElementById('log').innerHTML =
    '[' + new Date().toLocaleTimeString() + '] ' + msg
    + '<br>' + document.getElementById('log').innerHTML
}

</script>

</body>
</html>
