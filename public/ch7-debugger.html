<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>手写Vue3 VNode（Debugger版）</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Noto Sans SC', system-ui, -apple-system, sans-serif;
      background: #070b09;
      color: #d0e4da;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 20px;
    }
    .box {
      background: #0d1612;
      border: 1px solid #1a2e25;
      border-radius: 12px;
      padding: 40px 48px;
      text-align: center;
      max-width: 600px;
      width: 100%;
    }
    .box h1 {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 6px;
      color: #d0e4da;
    }
    .box h1 small {
      display: block;
      font-size: 0.72rem;
      font-weight: 400;
      color: #5e8a76;
      margin-top: 6px;
    }
    .display-area {
      margin: 24px 0;
      padding: 20px;
      background: #0a100d;
      border: 1px solid #1a2e25;
      border-radius: 8px;
    }
    .tree-vis {
      text-align: left;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      line-height: 1.8;
    }
    .tree-line { padding: 2px 0; color: #5e8a76; }
    .tree-line .tag { color: #10b981; font-weight: 700; }
    .tree-line .prop { color: #f59e0b; }
    .tree-line .text { color: #f0a85e; }
    .tree-line .el { color: #60a5fa; }
    .tree-line .hl { background: rgba(16,185,129,0.1); border-radius: 3px; padding: 0 4px; }
    .display-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      margin: 6px 0;
    }
    .display-label { font-size: 0.78rem; color: #5e8a76; }
    .display-val {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
    }
    .display-val.count { color: #f59e0b; font-size: 1.5rem; }
    .btn-group {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin: 20px 0;
      flex-wrap: wrap;
    }
    .btn {
      padding: 10px 18px;
      font-size: 0.82rem;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
      color: white;
    }
    .btn-setup { background: linear-gradient(135deg, #6b7280, #9ca3af); }
    .btn-setup:hover { box-shadow: 0 4px 20px rgba(156, 163, 175, 0.35); transform: translateY(-1px); }
    .btn-vnode { background: linear-gradient(135deg, #059669, #10b981); box-shadow: 0 2px 12px rgba(16, 185, 129, 0.2); }
    .btn-vnode:hover { box-shadow: 0 4px 20px rgba(16, 185, 129, 0.35); transform: translateY(-1px); }
    .btn-mount { background: linear-gradient(135deg, #7c3aed, #a78bfa); box-shadow: 0 2px 12px rgba(167, 139, 250, 0.2); }
    .btn-mount:hover { box-shadow: 0 4px 20px rgba(167, 139, 250, 0.35); transform: translateY(-1px); }
    .btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none !important; }
    .tip-box {
      background: #0a100d;
      border: 1px solid #1a2e25;
      border-radius: 8px;
      padding: 16px 20px;
      margin-top: 20px;
      text-align: left;
      line-height: 1.9;
    }
    .tip-box p { font-size: 0.78rem; color: #5e8a76; }
    .tip-box strong { color: #d0e4da; }
    kbd {
      background: rgba(94, 138, 118, 0.15);
      border: 1px solid #1a2e25;
      border-radius: 3px;
      padding: 1px 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      color: #10b981;
    }
    code { color: #60a5fa; font-family: 'JetBrains Mono', monospace; }
    .divider { border: none; border-top: 1px solid #1a2e25; margin: 16px 0; }
    .status-box {
      background: #070b09;
      border: 1px solid #1a2e25;
      border-radius: 6px;
      padding: 10px 14px;
      margin-top: 10px;
      font-size: 0.75rem;
      font-family: monospace;
      line-height: 1.7;
      text-align: left;
    }
    .mount-flow {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin: 10px 0;
      flex-wrap: wrap;
    }
    .flow-step {
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.65rem;
      background: rgba(7,11,9,0.6);
      border: 1px solid #1a2e25;
      color: #5e8a76;
      transition: all 0.3s;
    }
    .flow-step.active { border-color: #10b981; color: #10b981; background: rgba(16,185,129,0.06); }
    .flow-step.done { border-color: rgba(16,185,129,0.3); color: rgba(16,185,129,0.6); }
    .flow-arrow { color: #5e8a76; font-size: 0.7rem; display: flex; align-items: center; }
    #mountTarget {
      margin-top: 10px;
      padding: 10px;
      background: #0a100d;
      border: 1px dashed #1a2e25;
      border-radius: 6px;
      min-height: 40px;
    }
    #mountTarget * { margin: 0; }
    #mountTarget p { color: #d0e4da; font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; }
    #mountTarget span { color: #60a5fa; font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; }
  </style>
</head>
<body>
  <div class="box">
    <h1>
      Vue VNode Debugger
      <small>先打开 F12 → 按顺序点击按钮逐步学习</small>
    </h1>

    <div class="display-area">
      <div class="display-row">
        <span class="display-label">VNode 树</span>
      </div>
      <div class="tree-vis" id="vnodeVis">
        <div class="tree-line">（尚未创建）</div>
      </div>
      <hr class="divider">
      <div class="display-label" style="margin-bottom:6px;font-size:0.72rem">渲染流程</div>
      <div class="mount-flow" id="mountFlow">
        <div class="flow-step" id="step-create">createElement</div>
        <div class="flow-arrow">→</div>
        <div class="flow-step" id="step-props">setProps</div>
        <div class="flow-arrow">→</div>
        <div class="flow-step" id="step-children">children</div>
        <div class="flow-arrow">→</div>
        <div class="flow-step" id="step-cache">cache el</div>
        <div class="flow-arrow">→</div>
        <div class="flow-step" id="step-append">appendChild</div>
      </div>
      <div id="mountTarget"></div>
    </div>

    <div class="btn-group">
      <button class="btn btn-setup" id="setupBtn" onclick="setup()">1. 初始化</button>
      <button class="btn btn-vnode" id="vnodeBtn" onclick="createVNode()" disabled>2. 创建 VNode</button>
      <button class="btn btn-mount" id="mountBtn" onclick="mountVNode()" disabled>3. mountElement</button>
    </div>

    <hr class="divider">
    <div class="status-box" id="logArea">
      点击「初始化」开始
    </div>
  </div>

<script>
/* ===== VNode 创建 ===== */
function h(type, props, children) {
  debugger // h() 函数：创建 VNode
  const vnode = {
    type,
    props: props || {},
    children: children || [],
    el: null
  }
  debugger // VNode 已创建
  return vnode
}

/* ===== mountElement ===== */
function mountElement(vnode, container) {
  debugger // ① mountElement 进入：挂载 vnode

  // 1. createElement
  debugger // ② createElement：创建 DOM 元素
  const el = document.createElement(vnode.type)
  updateStep('create')
  debugger // ③ DOM 元素已创建

  // 2. setProps
  if (vnode.props) {
    for (const key in vnode.props) {
      debugger // 设置属性：${key} = ${vnode.props[key]}
      el.setAttribute(key, vnode.props[key])
    }
  }
  updateStep('props')
  debugger // ④ 属性设置完成

  // 3. 处理 children
  if (typeof vnode.children === 'string') {
    debugger // children 是文本
    el.textContent = vnode.children
  } else if (Array.isArray(vnode.children)) {
    debugger // ⑤ 递归挂载子节点
    vnode.children.forEach(child => {
      mountElement(child, el)
    })
  }
  updateStep('children')
  debugger // ⑥ 子节点处理完成

  // 4. 缓存 el
  vnode.el = el
  updateStep('cache')
  debugger // ⑦ el 已缓存到 vnode.el

  // 5. 挂载到容器
  container.appendChild(el)
  updateStep('append')
  debugger // ⑧ 已挂载到 DOM
}

let vnodeTree = null
let container = null

function updateStep(step) {
  const steps = ['create', 'props', 'children', 'cache', 'append']
  const idx = steps.indexOf(step)
  const ids = ['step-create', 'step-props', 'step-children', 'step-cache', 'step-append']
  ids.forEach((id, i) => {
    const el = document.getElementById(id)
    if (i < idx) el.className = 'flow-step done'
    else if (i === idx) el.className = 'flow-step active'
    else el.className = 'flow-step'
  })
}

function updateVNodeDisplay() {
  const el = document.getElementById('vnodeVis')
  if (!vnodeTree) {
    el.innerHTML = '<div class="tree-line">（空）</div>'
    return
  }
  let html = ''
  function printNode(vn, indent) {
    const pad = '  '.repeat(indent)
    const tag = `<span class="tag">&lt;${vn.type}&gt;</span>`
    const props = Object.entries(vn.props || {}).map(([k, v]) => `<span class="prop">${k}="${v}"</span>`).join(' ')
    html += `<div class="tree-line">${pad}${tag} ${props} ${vn.el ? '<span class="el">✓ el</span>' : ''}</div>`
    if (Array.isArray(vn.children)) {
      vn.children.forEach(c => printNode(c, indent + 1))
    } else if (typeof vn.children === 'string') {
      html += `<div class="tree-line">${pad}  <span class="text">"${vn.children}"</span></div>`
    }
  }
  printNode(vnodeTree, 0)
  el.innerHTML = html
}

/* ===== 按钮操作 ===== */
function setup() {
  document.getElementById('setupBtn').disabled = true
  container = document.getElementById('mountTarget')
  container.innerHTML = ''
  document.getElementById('vnodeBtn').disabled = false
  log('初始化完成')
}

function createVNode() {
  debugger // 创建 VNode 树
  document.getElementById('vnodeBtn').disabled = true

  vnodeTree = h('div', { id: 'app', class: 'container' }, [
    h('p', {}, 'Hello'),
    h('span', { class: 'highlight' }, 'Vue')
  ])

  updateVNodeDisplay()
  document.getElementById('mountBtn').disabled = false
  log('VNode 树已创建：div#app > p + span')
}

function mountVNode() {
  debugger // 开始挂载
  document.getElementById('mountBtn').disabled = true

  // 重置步骤显示
  document.querySelectorAll('.flow-step').forEach(el => el.className = 'flow-step')

  mountElement(vnodeTree, container)
  updateVNodeDisplay()
  log('mountElement 完成，DOM 已渲染')
}

function log(msg) {
  const area = document.getElementById('logArea')
  const t = new Date().toLocaleTimeString()
  area.innerHTML = `[${t}] ${msg}\n` + area.innerHTML
}
</script>
</body>
</html>
