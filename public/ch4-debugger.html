<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vue 侦听器（Debugger版）</title>

<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: system-ui, sans-serif;
    background:#070b09;
    color:#d0e4da;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:40px;
  }
  .box {
    width:600px;
    background:#0d1612;
    border:1px solid #1a2e25;
    border-radius:12px;
    padding:40px;
  }
  .val {
    font-family: monospace;
    margin:6px 0;
  }
  .count { color:#f59e0b; }
  .nested { color:#60a5fa; }

  button {
    margin:6px;
    padding:10px 14px;
    border:none;
    border-radius:8px;
    font-weight:700;
    color:white;
    cursor:pointer;
  }
  .init { background:#6b7280; }
  .watch { background:#10b981; }
  .change { background:#ef4444; }
  .nestedBtn { background:#2563eb; }

  button:disabled { opacity:0.4; }

  .log {
    margin-top:16px;
    background:#070b09;
    border:1px solid #1a2e25;
    border-radius:6px;
    padding:10px;
    font-size:0.75rem;
    font-family:monospace;
    text-align:left;
    line-height:1.7;
  }
</style>
</head>

<body>

<div class="box">
  <h1>Vue 侦听器 Debugger</h1>

  <div class="val count">count: <span id="count">0</span></div>
  <div class="val nested">nested.num: <span id="nested">0</span></div>

  <div class="val">回调次数: <span id="cb">0</span></div>
  <div class="val">traverse深度: <span id="depth">0</span></div>

  <button class="init" onclick="init()">初始化</button>
  <button class="watch" onclick="createWatch()" id="w" disabled>创建watch</button>
  <button class="change" onclick="incCount()" id="c1" disabled>改count</button>
  <button class="nestedBtn" onclick="incNested()" id="c2" disabled>改nested</button>

  <div class="log" id="logArea">点击「初始化」开始</div>
</div>

<script>

/* ================= reactive ================= */

let activeEffect = null
const bucket = new Map()
let state = null

function effect(fn, options = {}) {
  const e = () => {
    debugger // ① effect执行开始 → 【观察】activeEffect 被赋值，即将执行 fn()
    activeEffect = e
    const res = fn()
    activeEffect = null
    return res
  }
  e.options = options
  e()
  return e
}

function track(t, k) {
  if (!activeEffect) return

  let map = bucket.get(t)
  if (!map) { map = new Map(); bucket.set(t, map) }

  let set = map.get(k)
  if (!set) { set = new Set(); map.set(k, set) }

  set.add(activeEffect)
}

function trigger(t, k) {
  const map = bucket.get(t)
  if (!map) return

  const set = map.get(k)
  if (!set) return

  set.forEach(fn => {

    debugger // ② trigger → 【观察】看 fn.options.scheduler 是否存在

    if (fn.options.scheduler) {
      debugger // ③ watch 的 effect 走 scheduler（异步执行，不立即计算）
      fn.options.scheduler(fn)
    } else {
      fn()
    }
  })
}

const reactiveMap = new WeakMap()

function reactive(obj) {
  // 已经是 Proxy 的不再包裹
  if (reactiveMap.has(obj)) return reactiveMap.get(obj)

  const proxy = new Proxy(obj, {
    get(t, k) {
      track(t, k)
      const val = t[k]
      // 深响应式：如果值是对象，递归包裹 Proxy
      if (typeof val === 'object' && val !== null) {
        return reactive(val)
      }
      return val
    },
    set(t, k, v) {
      t[k] = v
      trigger(t, k)
      return true
    }
  })

  reactiveMap.set(obj, proxy)
  return proxy
}

/* ================= traverse ================= */

let depth = 0

function traverse(val, seen = new Set()) {

  debugger // ④ traverse 开始 → 【观察】val 是什么？深度遍历会递归访问所有属性，触发 track
  // 注意：depth 会在页面上显示遍历深度

  if (typeof val !== 'object' || val === null || seen.has(val)) return
  seen.add(val)

  for (const k in val) {

    depth++
    document.getElementById('depth').innerText = depth

    debugger // ⑤ 访问属性 → 【观察】当前遍历的 key 是什么？触发 track 会被收集为依赖
    // 页面上 depth+1 表示进入一层

    traverse(val[k], seen)

    depth--
    document.getElementById('depth').innerText = depth
  }

  return val
}

/* ================= watch ================= */

let cbCount = 0

function watch(source, cb) {

  debugger // ⑥ watch 初始化 → 【观察】source 是对象，所以 getter = () => traverse(source)
  // 目的：通过 traverse 深度遍历所有属性，让每个属性都被 track 收集

  let getter

  if (typeof source === 'function') {
    getter = source
  } else {
    getter = () => traverse(source)
  }

  let oldValue
  let newValue

  const job = () => {

    debugger // ⑦ scheduler 触发（依赖变化）→ 【观察】执行 runner() 获取新值，然后调用 cb
    // 新旧值在此处比较

    newValue = runner()
    cbCount++
    document.getElementById('cb').innerText = cbCount

    cb(newValue, oldValue)

    oldValue = newValue
  }

  const runner = effect(() => {

    debugger // ⑧ watch getter 执行 → 【观察】正在收集依赖（跑 traverse，递归 track 所有属性）
    // 这样后续任何属性变化都能触发 watch 回调

    return getter()

  }, {
    scheduler: job
  })

  oldValue = runner()

  debugger // ⑨ 初始值记录完成 → 【观察】oldValue 已保存，后续变化会通过 scheduler 触发
}

/* ================= demo ================= */

function init() {
  state = reactive({
    count: 0,
    nested: { num: 0 }
  })

  document.getElementById('w').disabled = false
}

function createWatch() {

  // 使用 state 对象作为 source → 触发 traverse 深度遍历
  watch(state, (nv, ov) => {

    debugger // ⑪ callback 执行 → 【观察】newValue 和 oldValue 的值，traverse 已收集所有嵌套依赖
    // 修改 count 或 nested.num 都会触发此回调

    log(`count: ${state.count}, nested.num: ${state.nested.num}`)
  })

  document.getElementById('c1').disabled = false
  document.getElementById('c2').disabled = false
}

function incCount() {
  // 【观察】修改 state.count → trigger → watch 的 scheduler 执行 → 回调拿到新旧值
  debugger
  state.count++
  document.getElementById('count').innerText = state.count
}

function incNested() {
  // 【观察】修改 state.nested.num → 深层属性也被 traverse 收集，同样触发 watch 回调
  debugger
  state.nested.num++
  document.getElementById('nested').innerText = state.nested.num
}

function log(msg) {
  const area = document.getElementById('logArea')
  const t = new Date().toLocaleTimeString()
  const prev = area.innerHTML
  area.innerHTML = `[${t}] ${msg}<br>` + prev
}

</script>

</body>
</html>
