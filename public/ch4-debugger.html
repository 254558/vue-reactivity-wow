<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vue 侦听器（Debugger版）</title>

<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: system-ui, sans-serif;
    background:#070b09;
    color:#d0e4da;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:40px;
  }
  .box {
    width:600px;
    background:#0d1612;
    border:1px solid #1a2e25;
    border-radius:12px;
    padding:40px;
  }
  .val {
    font-family: monospace;
    margin:6px 0;
  }
  .count { color:#f59e0b; }
  .nested { color:#60a5fa; }

  button {
    margin:6px;
    padding:10px 14px;
    border:none;
    border-radius:8px;
    font-weight:700;
    color:white;
    cursor:pointer;
  }
  .init { background:#6b7280; }
  .watch { background:#10b981; }
  .change { background:#ef4444; }
  .nestedBtn { background:#2563eb; }

  button:disabled { opacity:0.4; }

  .log {
    margin-top:16px;
    background:#070b09;
    border:1px solid #1a2e25;
    border-radius:6px;
    padding:10px;
    font-size:0.75rem;
    font-family:monospace;
    text-align:left;
    line-height:1.7;
  }
</style>
</head>

<body>

<div class="box">
  <h1>Vue 侦听器 Debugger</h1>

  <div class="val count">count: <span id="count">0</span></div>
  <div class="val nested">nested.num: <span id="nested">0</span></div>

  <div class="val">回调次数: <span id="cb">0</span></div>
  <div class="val">traverse深度: <span id="depth">0</span></div>

  <button class="init" onclick="init()">初始化</button>
  <button class="watch" onclick="createWatch()" id="w" disabled>创建watch</button>
  <button class="change" onclick="incCount()" id="c1" disabled>改count</button>
  <button class="nestedBtn" onclick="incNested()" id="c2" disabled>改nested</button>

  <div class="log" id="logArea">点击「初始化」开始</div>
</div>

<script>

let activeEffect = null
const bucket = new Map()
let state = null

function effect(fn, options = {}) {
  const e = () => {
    activeEffect = e
    const res = fn()
    activeEffect = null
    return res
  }
  e.options = options
  e()
  return e
}

function track(t, k) {
  if (!activeEffect) return

  let map = bucket.get(t)
  if (!map) { map = new Map(); bucket.set(t, map) }

  let set = map.get(k)
  if (!set) { set = new Set(); map.set(k, set) }

  set.add(activeEffect)
}

function trigger(t, k) {
  const map = bucket.get(t)
  if (!map) return

  const set = map.get(k)
  if (!set) return

  set.forEach(fn => {
    // ① trigger 判断执行方式
    // Scope > Local: fn = 当前 effect，展开 fn.options 看 scheduler 是否存在
    debugger

    if (fn.options.scheduler) {
      // ② 走 scheduler 分支（watch 的 effect）
      // Scope > Local: fn.options.scheduler = job 函数
      // 不会立即重新执行 effect，而是交给 scheduler 异步处理
      debugger

      fn.options.scheduler(fn)
    } else {
      fn()
    }
  })
}

const reactiveMap = new WeakMap()

function reactive(obj) {
  if (reactiveMap.has(obj)) return reactiveMap.get(obj)

  const proxy = new Proxy(obj, {
    get(t, k) {
      track(t, k)
      const val = t[k]
      if (typeof val === 'object' && val !== null) {
        return reactive(val)
      }
      return val
    },
    set(t, k, v) {
      t[k] = v
      trigger(t, k)
      return true
    }
  })

  reactiveMap.set(obj, proxy)
  return proxy
}

let depth = 0

function traverse(val, seen = new Set()) {
  if (typeof val !== 'object' || val === null || seen.has(val)) return
  seen.add(val)

  for (const k in val) {
    depth++
    document.getElementById('depth').innerText = depth

    // ③ traverse 正在访问属性
    // Scope > Block: k = 当前属性名（"count" 或 "nested" 等）
    // 读取 val[k] 会触发 Proxy get → track，把这个属性收集为依赖
    debugger

    traverse(val[k], seen)

    depth--
    document.getElementById('depth').innerText = depth
  }

  return val
}

let cbCount = 0

function watch(source, cb) {
  let getter

  if (typeof source === 'function') {
    getter = source
  } else {
    // source 是对象 → 用 traverse 深度遍历所有属性
    getter = () => traverse(source)
  }

  let oldValue
  let newValue

  const job = () => {
    newValue = runner()
    cbCount++
    document.getElementById('cb').innerText = cbCount

    // ④ watch 的 scheduler 触发（依赖变化后）
    // Scope > Closure: newValue = 重新执行 getter 的结果，oldValue = 上次的结果
    // 接下来会调用 cb(newValue, oldValue)
    debugger

    cb(newValue, oldValue)

    oldValue = newValue
  }

  const runner = effect(() => {
    // ⑤ watch 的 effect 执行
    // Scope > Local: getter = () => traverse(source)
    // traverse 会递归读取所有属性，每个属性都被 track 收集
    // 这样后续改 count 或 nested.num 都能触发 watch 回调
    debugger

    return getter()
  }, {
    scheduler: job
  })

  oldValue = runner()

  // ⑥ watch 初始化完成
  // Scope > Closure: oldValue = 初始遍历结果
  // 所有嵌套属性已被 traverse 收集为依赖
  debugger
}

function init() {
  state = reactive({
    count: 0,
    nested: { num: 0 }
  })

  document.getElementById('w').disabled = false
}

function createWatch() {
  // ⑦ 创建 watch
  // Scope > Script: state = Proxy{count:0, nested:Proxy{num:0}}
  // watch(state, cb) → 内部会 traverse 深度遍历 state 的所有属性
  debugger

  watch(state, (nv, ov) => {
    // ⑧ watch 回调执行
    // Scope > Local: nv = 新值，ov = 旧值
    // 无论是改 count 还是 nested.num，traverse 都已收集依赖，都能触发
    debugger

    log(`count: ${state.count}, nested.num: ${state.nested.num}`)
  })

  document.getElementById('c1').disabled = false
  document.getElementById('c2').disabled = false
}

function incCount() {
  // ⑨ 修改 state.count
  // 按 F8 继续后：set → trigger → watch 的 scheduler → 回调执行
  debugger

  state.count++
  document.getElementById('count').innerText = state.count
}

function incNested() {
  // ⑩ 修改 state.nested.num（深层属性）
  // 按 F8 继续后：同样触发 trigger → scheduler → 回调
  // 因为 traverse 深度遍历时也收集了 nested.num 的依赖
  debugger

  state.nested.num++
  document.getElementById('nested').innerText = state.nested.num
}

function log(msg) {
  const area = document.getElementById('logArea')
  const t = new Date().toLocaleTimeString()
  const prev = area.innerHTML
  area.innerHTML = `[${t}] ${msg}<br>` + prev
}

</script>
</body>
</html>
