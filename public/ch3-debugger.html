<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vue 计算属性（Debugger版）</title>

<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: system-ui, sans-serif;
    background:#070b09;
    color:#d0e4da;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:40px;
  }
  .box {
    width:560px;
    background:#0d1612;
    border:1px solid #1a2e25;
    border-radius:12px;
    padding:40px;
    text-align:center;
  }
  .display {
    background:#0a100d;
    border:1px solid #1a2e25;
    padding:16px;
    border-radius:8px;
    margin:20px 0;
    font-family:monospace;
  }
  .val { font-size:20px; margin:6px 0; }
  .count { color:#f59e0b; }
  .computed { color:#10b981; }
  .dirty { color:#ef4444; }

  button {
    margin:6px;
    padding:10px 14px;
    border:none;
    border-radius:8px;
    color:white;
    font-weight:700;
    cursor:pointer;
  }
  .init { background:#6b7280; }
  .read { background:#10b981; }
  .modify { background:#ef4444; }

  button:disabled { opacity:0.4; }
</style>
</head>

<body>

<div class="box">
  <h1>Vue 计算属性 Debugger</h1>

  <div class="display">
    <div class="val count">state.count: <span id="count">0</span></div>
    <div class="val computed">computed: <span id="computed">-</span></div>
    <div class="val dirty">dirty: <span id="dirty">true</span></div>
    <div class="val">getter执行次数: <span id="calls">0</span></div>
  </div>

  <button class="init" onclick="init()" id="initBtn">初始化</button>
  <button class="read" onclick="read1()" id="r1" disabled>读取computed</button>
  <button class="read" onclick="read2()" id="r2" disabled>再次读取（缓存）</button>
  <button class="modify" onclick="inc()" id="inc" disabled>修改count</button>
  <button class="read" onclick="read3()" id="r3" disabled>修改后读取</button>
</div>

<script>

let activeEffect = null
const bucket = new Map()
let state = null

function effect(fn, options = {}) {
  const e = () => {
    activeEffect = e
    const res = fn()
    activeEffect = null
    return res
  }
  e.options = options
  e()
  return e
}

function track(target, key) {
  if (!activeEffect) return

  let map = bucket.get(target)
  if (!map) { map = new Map(); bucket.set(target, map) }

  let deps = map.get(key)
  if (!deps) { deps = new Set(); map.set(key, deps) }

  deps.add(activeEffect)
}

function trigger(target, key) {
  const map = bucket.get(target)
  if (!map) return

  const deps = map.get(key)
  if (!deps) return

  deps.forEach(fn => {
    // ① trigger 判断执行方式
    // Scope > Local: fn = 当前 effect，展开 fn.options 看 scheduler 是否存在
    debugger

    if (fn.options.scheduler) {
      // ② 走 scheduler 分支（computed 的 effect）
      // Scope > Local: fn.options.scheduler 存在
      // 不会重新执行 getter，只标记 dirty=true（懒计算）
      debugger

      fn.options.scheduler(fn)
    } else {
      fn()
    }
  })
}

function reactive(obj) {
  return new Proxy(obj, {
    get(t, k) { track(t, k); return t[k] },
    set(t, k, v) {
      t[k] = v
      trigger(t, k)
      return true
    }
  })
}

function computed(getter) {
  let dirty = true
  let value
  let callCount = 0

  const runner = effect(getter, {
    scheduler() {
      dirty = true
      document.getElementById('dirty').innerText = 'true'

      // ③ scheduler 被调用（依赖变化时）
      // Scope > Closure: dirty = true（刚被标记），value 是旧缓存值
      // 注意：没有执行 getter！下次读取 .value 时才会重新计算
      debugger
    }
  })

  return {
    get value() {
      // ④ 读取 computed.value
      // Scope > Closure: dirty = true 或 false
      // dirty=true → 走计算分支，dirty=false → 走缓存分支
      debugger

      if (dirty) {
        value = runner()
        callCount++
        document.getElementById('calls').innerText = callCount

        dirty = false
        document.getElementById('dirty').innerText = 'false'

        // ⑤ 计算完成
        // Scope > Closure: dirty = false，value = 新计算的值，callCount +1
        debugger

      } else {
        // ⑥ 命中缓存
        // Scope > Closure: dirty = false，直接返回上次缓存的 value
        // getter 不执行 — 这就是 computed 的性能优化
        debugger
      }

      return value
    }
  }
}

let c = null

function init() {
  document.getElementById('initBtn').disabled = true

  state = reactive({ count: 0 })

  c = computed(() => {
    return state.count * 2
  })

  // ⑦ 初始化完成
  // Scope > Script: state = Proxy{count:0}，c = computed 对象
  // 注意：dirty 仍然是 true！effect 初始化只是收集了依赖，并没有计算 value
  // 要等第一次读取 c.value 时才会执行 getter 并缓存结果
  debugger

  document.getElementById('r1').disabled = false
  document.getElementById('r2').disabled = false
  document.getElementById('inc').disabled = false
  document.getElementById('r3').disabled = false
}

function render(computedValue) {
  document.getElementById('count').innerText = state.count
  if (computedValue !== undefined) {
    document.getElementById('computed').innerText = computedValue
  }
}

function read1() {
  // ⑧ 首次读取 computed.value
  // Scope > Script: dirty = true（还没读取过 .value）
  // 按 F8 继续后：c.value 进入 getter → dirty=true → 走计算分支 → 执行 runner() → 缓存结果
  debugger

  const v = c.value
  render(v)
}

function read2() {
  // ⑨ 再次读取 computed.value
  // Scope > Script: dirty 仍然是 false → 命中缓存，getter 不执行
  debugger

  const v = c.value
  render(v)
}

function inc() {
  // ⑩ 修改 state.count
  // 按 F8 继续后：set → trigger → computed 的 scheduler → dirty 变 true
  // 但此时不会重新计算！要等到下次读取 .value 才算
  debugger

  state.count++
  render()
}

function read3() {
  // ⑪ 修改后读取 computed.value
  // Scope > Script: dirty = true（被 scheduler 标记了）→ 走计算分支
  // runner() 重新执行 getter，得到新值
  debugger

  const v = c.value
  render(v)
}

</script>
</body>
</html>
