<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vue Ref（Debugger版）</title>

<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: system-ui, sans-serif;
    background:#070b09;
    color:#d0e4da;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:40px;
  }
  .box {
    width:600px;
    background:#0d1612;
    border:1px solid #1a2e25;
    border-radius:12px;
    padding:40px;
    text-align:center;
  }

  .val {
    font-family: monospace;
    margin:6px 0;
  }
  .count { color:#f59e0b; font-size:24px; }
  .track { color:#10b981; }
  .trigger { color:#ef4444; }
  .unwrap { color:#60a5fa; }

  button {
    margin:6px;
    padding:10px 14px;
    border:none;
    border-radius:8px;
    font-weight:700;
    color:white;
    cursor:pointer;
  }
  .init { background:#6b7280; }
  .ref { background:#10b981; }
  .read { background:#2563eb; }
  .write { background:#ef4444; }
  .unwrapBtn { background:#7c3aed; }

  button:disabled { opacity:0.4; }
</style>
</head>

<body>

<div class="box">
  <h1>Vue Ref Debugger</h1>

  <div class="val count">value: <span id="val">未创建</span></div>

  <div class="val track">track: <span id="track">-</span></div>
  <div class="val trigger">trigger: <span id="trigger">-</span></div>

  <div class="val unwrap">proxyRefs: <span id="unwrap">-</span></div>

  <div class="val">get: <span id="get">0</span> | set: <span id="set">0</span></div>

  <button class="init" onclick="init()">初始化</button>
  <button class="ref" onclick="createRef()" id="b1" disabled>ref(0)</button>
  <button class="read" onclick="readRef()" id="b2" disabled>读取</button>
  <button class="write" onclick="writeRef()" id="b3" disabled>修改</button>
  <button class="unwrapBtn" onclick="demo()" id="b4" disabled>proxyRefs</button>
</div>

<script>

let activeEffect = null
const bucket = new Map()

let getCount = 0
let setCount = 0

function effect(fn) {
  const e = () => {
    activeEffect = e
    const res = fn()
    activeEffect = null
    return res
  }
  e()
  return e
}

function track(t, k) {
  if (!activeEffect) return
  document.getElementById('track').innerText = `track(${k})`

  let map = bucket.get(t)
  if (!map) { map = new Map(); bucket.set(t, map) }

  let set = map.get(k)
  if (!set) { set = new Set(); map.set(k, set) }
  set.add(activeEffect)
}

function trigger(t, k) {
  document.getElementById('trigger').innerText = `trigger(${k})`
  const map = bucket.get(t)
  if (!map) return
  const set = map.get(k)
  if (!set) return
  set.forEach(fn => {
    // ① trigger 通知更新
    // Scope > Local: fn = 需要重新执行的 effect，k = "value"
    debugger

    fn()
  })
}

function ref(val) {
  const wrapper = { value: val }
  Object.defineProperty(wrapper, '__v_isRef', { value: true })

  let proxy = new Proxy(wrapper, {
    get(t, k) {
      getCount++
      document.getElementById('get').innerText = getCount
      track(proxy, k)

      // ② ref get → 访问 r.value 时触发
      // Scope > Local: k = "value"（ref 只有一个 key）
      // track 已执行，依赖已收集
      debugger

      return t[k]
    },
    set(t, k, v) {
      setCount++
      document.getElementById('set').innerText = setCount
      t[k] = v
      trigger(proxy, k)

      // ③ ref set → 修改 r.value 时触发
      // Scope > Local: k = "value"，v = 新值
      // trigger 已执行，effect 会重新运行，页面值变化
      debugger

      return true
    }
  })

  // ④ ref 创建完成
  // Scope > Local: proxy = Proxy{value: val}，wrapper.__v_isRef = true
  debugger

  return proxy
}

function proxyRefs(obj) {
  return new Proxy(obj, {
    get(t, k) {
      const v = t[k]

      if (v && v.__v_isRef) {
        // ⑤ proxyRefs get → 自动解包
        // Scope > Local: k = "count"，v = ref(10)（是个 Proxy）
        // v.__v_isRef = true → 返回 v.value = 10，无需手动 .value
        debugger

        document.getElementById('unwrap').innerText = 'auto-unwrapped'
        return v.value
      }
      return v
    },
    set(t, k, v) {
      const old = t[k]

      if (old && old.__v_isRef) {
        old.value = v

        // ⑥ proxyRefs set → 自动包装
        // Scope > Local: k = "count"，v = 外部传入的新值，old = ref 对象
        // 设置 old.value = v，外界无需知道内部是 ref
        debugger

        return true
      }
      t[k] = v
      return true
    }
  })
}

let r = null

function renderView() {
  document.getElementById('val').innerText = r.value
}

function init() {
  document.getElementById('b1').disabled = false
  document.getElementById('track').innerText = '-'
  document.getElementById('trigger').innerText = '-'
  document.getElementById('unwrap').innerText = '-'
  getCount = setCount = 0
  document.getElementById('get').innerText = 0
  document.getElementById('set').innerText = 0
}

function createRef() {
  r = ref(0)
  effect(renderView)

  // ⑦ ref(0) 创建完毕，effect 已注册
  // Scope > Script: r = Proxy{value:0}，bucket 中有 "value" 的依赖
  debugger

  document.getElementById('b2').disabled = false
  document.getElementById('b3').disabled = false
  document.getElementById('b4').disabled = false
}

function readRef() {
  // ⑧ 读取 r.value
  // 按 F8 继续后：走 Proxy get → track → 返回值
  debugger

  const v = r.value
}

function writeRef() {
  // ⑨ 修改 r.value++
  // 按 F8 继续后：走 Proxy set → trigger → effect 重新执行 → 页面值变化
  debugger

  r.value++
}

function demo() {
  const obj = { count: ref(10) }
  const p = proxyRefs(obj)

  // ⑩ proxyRefs 演示
  // Scope > Local: p = proxyRefs 代理对象
  // p.count 自动解包，返回 10（不需要 p.count.value）
  debugger

  const v = p.count
  document.getElementById('val').innerText = v
}
</script>

</body>
</html>
