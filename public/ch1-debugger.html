<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vue 响应式（Debugger版）</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      background: #070b09;
      color: #d0e4da;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 20px;
    }
    .box {
      background: #0d1612;
      border: 1px solid #1a2e25;
      border-radius: 12px;
      padding: 40px 48px;
      text-align: center;
      max-width: 520px;
      width: 100%;
    }
    .num-display {
      font-size: 3.5rem;
      font-weight: 900;
      font-family: monospace;
      color: #10b981;
      margin: 20px 0;
    }
    .btn-group { display: flex; gap: 12px; justify-content: center; margin: 24px 0; flex-wrap: wrap; }
    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      color: white;
    }
    .btn-setup { background: #6b7280; }
    .btn-add { background: #10b981; }
    .btn-reduce { background: #ef4444; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .tip-box {
      background: #0a100d;
      border: 1px solid #1a2e25;
      border-radius: 8px;
      padding: 16px;
      margin-top: 20px;
      text-align: left;
      font-size: 12px;
      line-height: 1.8;
      color: #5e8a76;
    }
  </style>
</head>

<body>
<div class="box">
  <h1>Vue 响应式 Debugger</h1>
  <div class="num-display" id="num">0</div>

  <div class="btn-group">
    <button class="btn btn-setup" id="setupBtn" onclick="setup()">初始化</button>
    <button class="btn btn-add" id="addBtn" onclick="add()" disabled>+1</button>
    <button class="btn btn-reduce" id="reduceBtn" onclick="reduce()" disabled>-1</button>
  </div>

  <div class="tip-box">
    <div>执行顺序核心链路：</div>
    <div>effect → get → track → set → trigger → effect</div>
  </div>
</div>

<script>

let activeEffect = null
const bucket = new Map()
let state = null

function effect(fn) {
  activeEffect = fn

  // ① activeEffect 已赋值
  // Scope > Script: activeEffect = fn（就是下面传进来的箭头函数）
  debugger

  fn()

  activeEffect = null

  // ② effect 执行结束
  // Scope > Script: activeEffect = null，bucket 里已收集好依赖
  // 展开 bucket > [[Entries]] > 0 > [1] > [[Entries]] 可以看到 target → key → Set 的结构
  debugger
}

function track(target, key) {
  if (!activeEffect) return

  let depsMap = bucket.get(target)
  if (!depsMap) {
    depsMap = new Map()
    bucket.set(target, depsMap)
  }

  let deps = depsMap.get(key)
  if (!deps) {
    deps = new Set()
    depsMap.set(key, deps)
  }

  deps.add(activeEffect)

  // ③ 依赖收集完成
  // Scope > Local: key = "count"（当前收集的是哪个属性）
  // Scope > Script: 展开 bucket > [[Entries]]，能看到 target → "count" → Set(fn) 的结构
  debugger
}

function trigger(target, key) {
  const depsMap = bucket.get(target)
  if (!depsMap) return

  const deps = depsMap.get(key)
  if (!deps) return

  // ④ 数据变化，取出依赖
  // Scope > Local: key = "count"，deps = Set(1)（里面存着需要重新执行的 effect）
  debugger

  deps.forEach(fn => {
    // ⑤ 重新执行 effect
    // Scope > Local: fn 就是最初传给 effect 的箭头函数
    // 注意：fn() 不是 effect()，所以 activeEffect 是 null，不会重新 track
    debugger

    fn()
  })
}

function reactive(data) {
  return new Proxy(data, {
    get(target, key) {
      track(target, key)

      // ⑥ Proxy get 拦截
      // Scope > Local: key = "count"（正在读取的属性名）
      // track 已执行，依赖已收集
      debugger

      return target[key]
    },

    set(target, key, val) {
      target[key] = val
      trigger(target, key)

      // ⑦ Proxy set 拦截
      // Scope > Local: key = "count"，val = 新值
      // target[key] 已修改，trigger 已执行，effect 已重新运行
      debugger

      return true
    }
  })
}

function setup() {
  document.getElementById('setupBtn').disabled = true

  state = reactive({ count: 0 })

  effect(() => {
    document.getElementById('num').innerText = state.count
  })

  // ⑧ 初始化完成
  // Scope > Script: state = Proxy{count: 0}，bucket 里已有 "count" 的依赖
  debugger

  document.getElementById('addBtn').disabled = false
  document.getElementById('reduceBtn').disabled = false
}

function add() {
  // ⑨ 点击 +1
  // Scope > Script: state.count 当前值
  // 按 F8 继续后会触发 set → trigger → fn() → 页面数字 +1
  debugger

  state.count++
}

function reduce() {
  // ⑩ 点击 -1
  // Scope > Script: state.count 当前值
  // 按 F8 继续后会触发 set → trigger → fn() → 页面数字 -1
  debugger

  state.count--
}
</script>
</body>
</html>
