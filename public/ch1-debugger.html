<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>手写Vue3响应式（Debugger教学优化版）</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      background: #070b09;
      color: #d0e4da;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 20px;
    }
    .box {
      background: #0d1612;
      border: 1px solid #1a2e25;
      border-radius: 12px;
      padding: 40px 48px;
      text-align: center;
      max-width: 520px;
      width: 100%;
    }
    .num-display {
      font-size: 3.5rem;
      font-weight: 900;
      font-family: monospace;
      color: #10b981;
      margin: 20px 0;
    }
    .btn-group { display: flex; gap: 12px; justify-content: center; margin: 24px 0; flex-wrap: wrap; }
    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      color: white;
    }
    .btn-setup { background: #6b7280; }
    .btn-add { background: #10b981; }
    .btn-reduce { background: #ef4444; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .tip-box {
      background: #0a100d;
      border: 1px solid #1a2e25;
      border-radius: 8px;
      padding: 16px;
      margin-top: 20px;
      text-align: left;
      font-size: 12px;
      line-height: 1.8;
      color: #5e8a76;
    }
  </style>
</head>

<body>
<div class="box">
  <h1>Vue 响应式 Debugger（教学优化版）</h1>
  <div class="num-display" id="num">0</div>

  <div class="btn-group">
    <button class="btn btn-setup" id="setupBtn" onclick="setup()">初始化</button>
    <button class="btn btn-add" id="addBtn" onclick="add()" disabled>+1</button>
    <button class="btn btn-reduce" id="reduceBtn" onclick="reduce()" disabled>-1</button>
  </div>

  <div class="tip-box">
    <div>执行顺序核心链路：</div>
    <div>effect → get → track → set → trigger → effect</div>
  </div>
</div>

<script>
/* ================= 响应式核心 ================= */

let activeEffect = null
const bucket = new Map()
let state = null

function effect(fn) {
  // ① 进入 effect：准备收集依赖
  debugger

  activeEffect = fn

  // ② 执行 fn → 会触发 get → 进入 track
  fn()

  // ③ fn 执行完，依赖已收集完成
  activeEffect = null

  debugger
}

/* 依赖收集：发生在 get 之后 */
function track(target, key) {
  // ④ 只有在 effect 执行时才会收集依赖
  debugger

  if (!activeEffect) return

  let depsMap = bucket.get(target)
  if (!depsMap) {
    depsMap = new Map()
    bucket.set(target, depsMap)
  }

  let deps = depsMap.get(key)
  if (!deps) {
    deps = new Set()
    depsMap.set(key, deps)
  }

  // ⑤ 建立：target → key → effect
  deps.add(activeEffect)

  debugger
}

/* 触发更新：发生在 set 之后 */
function trigger(target, key) {
  // ⑥ 数据发生变化，开始通知依赖
  debugger

  const depsMap = bucket.get(target)
  if (!depsMap) return

  const deps = depsMap.get(key)
  if (!deps) return

  deps.forEach(fn => {
    // ⑦ 重新执行 effect → 会再次触发 get → 重新 track
    debugger
    fn()
  })
}

/* Proxy 响应式 */
function reactive(data) {
  return new Proxy(data, {
    get(target, key) {
      // ⑧ 读取数据 → 触发依赖收集
      debugger

      track(target, key)

      return target[key]
    },

    set(target, key, val) {
      // ⑨ 修改数据 → 触发更新流程
      debugger

      target[key] = val

      trigger(target, key)

      return true
    }
  })
}

/* ================= 初始化 ================= */

function setup() {
  document.getElementById('setupBtn').disabled = true

  state = reactive({ count: 0 })

  effect(() => {
    document.getElementById('num').innerText = state.count
  })

  document.getElementById('addBtn').disabled = false
  document.getElementById('reduceBtn').disabled = false
}

/* ================= 操作 ================= */

function add() {
  debugger
  state.count++
}

function reduce() {
  debugger
  state.count--
}
</script>
</body>
</html>
