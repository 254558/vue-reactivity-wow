<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vue 响应式（Debugger版）</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      background: #070b09;
      color: #d0e4da;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 20px;
      position: relative;
    }
    .box {
      background: #0d1612;
      border: 1px solid #1a2e25;
      border-radius: 12px;
      padding: 40px 48px;
      text-align: center;
      max-width: 520px;
      width: 100%;
    }
    .num-display {
      font-size: 3.5rem;
      font-weight: 900;
      font-family: monospace;
      color: #10b981;
      margin: 20px 0;
    }
    .btn-group { display: flex; gap: 12px; justify-content: center; margin: 24px 0; flex-wrap: wrap; }
    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      color: white;
    }
    .btn-setup { background: #6b7280; }
    .btn-add { background: #10b981; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .tip-box {
      background: #0a100d;
      border: 1px solid #1a2e25;
      border-radius: 8px;
      padding: 16px;
      margin-top: 20px;
      text-align: left;
      font-size: 12px;
      line-height: 1.8;
      color: #5e8a76;
    }
    /* 可拖拽便利贴样式 */
    .note-sticky {
      position: fixed;
      right: 70px;
      top: 20%;
      width: 220px;
      padding: 20px;
      background: #fff9c4;
      color: #333;
      box-shadow: 3px 3px 10px rgba(0,0,0,0.3);
      font-size: 14px;
      line-height: 1.7;
      rotate: 3deg;
      cursor: move;
      user-select: none;
      z-index: 999;
    }
  </style>
</head>

<body>
<div class="box">
  <h1>Vue 响应式 Debugger</h1>
  <div class="num-display" id="num">0</div>

  <div class="btn-group">
    <button class="btn btn-setup" id="setupBtn" onclick="setup()">初始化</button>
    <button class="btn btn-add" id="addBtn" onclick="add()" disabled>+1</button>
  </div>

  <div class="tip-box">
    <div>执行顺序核心链路：</div>
    <div>effect → get → track → set → trigger → effect</div>
  </div>
</div>

<!-- 可拖拽便利贴 -->
<div class="note-sticky" id="dragNote">
点击 +1 完整流程：</br>
↓</br>
get  (第一次：读旧值 0)</br>
↓</br>
set  (修改成 1 → 调用 trigger)</br>
↓</br>
trigger  (通知更新)</br>
↓</br>
effect (重新执行渲染)</br>
↓</br>
get  (第二次：读新值 1 → 屏幕才变)
</div>
<script src="https://cdn.jsdelivr.net/npm/draggabilly@3/dist/draggabilly.pkgd.min.js"></script>
<script>
/* ================= 便利贴拖拽功能 ================= */
new Draggabilly('#dragNote');
/* ================= 响应式核心 ================= */

debugger
//刚开始一直点resume，直到初始化完成，完成后点按钮加1，F10观察
let activeEffect = null
const bucket = new Map()
let state = null

function effect(fn) {
  // ① 进入 effect → 【观察】activeEffect 即将被赋值为 fn
  debugger

  activeEffect = fn

  // ② 执行 fn → 触发 get → 进入 track（看下一行的 debugger 在 get 里）
  fn()

  // ③ fn 执行完，依赖已收集完成 → 【观察】activeEffect 已置 null（依赖收集阶段结束）
  activeEffect = null

  debugger
}

/* 依赖收集：发生在 get 之后 */
function track(target, key) {
  // ④ 进入 track → 【观察】activeEffect 是否为 fn（非空说明在 effect 内）
  debugger

  if (!activeEffect) return

  let depsMap = bucket.get(target)
  if (!depsMap) {
    depsMap = new Map()
    bucket.set(target, depsMap)
  }

  let deps = depsMap.get(key)
  if (!deps) {
    deps = new Set()
    depsMap.set(key, deps)
  }

  // ⑤ 建立：target → key → effect
  deps.add(activeEffect)

  // → 【观察】在 Scope 中展开 bucket，看 target → key → Set[effect] 的结构
  debugger
}

/* 触发更新：发生在 set 之后 */
function trigger(target, key) {
  // ⑥ 数据发生变化 → 【观察】从 bucket 中取出 deps，看哪些 effect 将被执行
  debugger

  const depsMap = bucket.get(target) //去全局仓库里，找一下这个对象，有没有它的依赖清单
  if (!depsMap) return

  const deps = depsMap.get(key) //从 “对象的依赖表” 中，取出 “当前属性（key）对应的所有依赖集合
  if (!deps) return

  deps.forEach(fn => {
    // ⑦ 重新执行 effect → 【观察】执行栈回到 effect 函数，将再次触发 get→track 流程
    debugger
    fn()
  })
}

/* Proxy 响应式 */
function reactive(data) {
  return new Proxy(data, {
    get(target, key) {
      // ⑧ get → 【观察】key 是什么？即将进入 track 收集依赖
      debugger

      //target是被代理的原始对象（比如 { name: 'aaa' }）
      //key是正在被读取的属性名（比如 name）
      track(target, key)//记录 “谁用到了这个属性”
      return target[key]//正常返回属性值
    },

    set(target, key, val) {
      // ⑨ set → 【观察】数据即将被修改，随后调用 trigger 通知所有依赖
      debugger

      target[key] = val // 修改值

      trigger(target, key) // 通知所有用到这个数据的地方“更新！”

      return true  // 告诉 JS：修改成功
    }
  })
}

/* ================= 初始化 ================= */

function setup() {
  // → 【观察】创建 reactive({ count: 0 })，然后执行 effect 建立依赖收集
  debugger

  document.getElementById('setupBtn').disabled = true

  state = reactive({ count: 0 })

  effect(() => {
    document.getElementById('num').innerText = state.count
  })

  document.getElementById('addBtn').disabled = false
}

/* ================= 操作 ================= */

function add() {
  // → 【观察】state.count++ 会触发 setter → trigger → 重新执行 effect 更新页面
  debugger
  state.count++
}
</script>
</body>
</html>
