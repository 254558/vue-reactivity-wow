<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vue 编译器（Debugger版）</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      background: #070b09;
      color: #d0e4da;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 20px;
    }
    .box {
      background: #0d1612;
      border: 1px solid #1a2e25;
      border-radius: 12px;
      padding: 40px 48px;
      text-align: center;
      max-width: 600px;
      width: 100%;
    }
    .box h1 {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 6px;
      color: #d0e4da;
    }
    .box h1 small {
      display: block;
      font-size: 0.72rem;
      font-weight: 400;
      color: #5e8a76;
      margin-top: 6px;
    }
    .display-area {
      margin: 24px 0;
      padding: 20px;
      background: #0a100d;
      border: 1px solid #1a2e25;
      border-radius: 8px;
    }
    .display-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      margin: 6px 0;
    }
    .display-label { font-size: 0.78rem; color: #5e8a76; }
    .pipeline {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }
    .stage {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      background: rgba(7,11,9,0.4);
      border: 1px solid #1a2e25;
      border-radius: 8px;
      transition: all 0.4s;
      opacity: 0.35;
    }
    .stage.active { opacity: 0.8; border-color: rgba(94,138,118,0.4); }
    .stage.processing { opacity: 1; border-color: rgba(16,185,129,0.6); background: rgba(16,185,129,0.06); }
    .stage-icon {
      width: 32px; height: 32px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.75rem; flex-shrink: 0;
    }
    .stage-icon.parse { background: rgba(96,165,250,0.12); color: #60a5fa; }
    .stage-icon.transform { background: rgba(139,92,246,0.12); color: #8b5cf6; }
    .stage-icon.codegen { background: rgba(239,68,68,0.12); color: #ef4444; }
    .stage-info { display: flex; flex-direction: column; gap: 2px; flex: 1; text-align: left; }
    .stage-label { font-weight: 700; font-size: 0.82rem; }
    .stage-desc { font-size: 0.62rem; color: #5e8a76; }
    .pipe-arrow { color: rgba(94,138,118,0.2); padding: 4px 0; }
    .pipe-arrow.active { color: #10b981; }
    .code-box {
      margin-top: 10px;
      background: #070b09;
      border: 1px solid #1a2e25;
      border-radius: 6px;
      padding: 12px;
      font-family: monospace;
      font-size: 0.72rem;
      text-align: left;
      line-height: 1.6;
      min-height: 40px;
      max-height: 320px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .code-box .kw { color: #7dd3a8; }
    .code-box .fn { color: #fbbf24; }
    .code-box .str { color: #f0a85e; }
    .code-box .key { color: #60a5fa; }
    .code-box .muted { color: #5e8a76; }
    .btn-group {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin: 20px 0;
      flex-wrap: wrap;
    }
    .btn {
      padding: 10px 18px;
      font-size: 0.82rem;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      color: white;
    }
    .btn-setup { background: #6b7280; }
    .btn-parse { background: #2563eb; }
    .btn-transform { background: #7c3aed; }
    .btn-codegen { background: #dc2626; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .tip-box {
      background: #0a100d;
      border: 1px solid #1a2e25;
      border-radius: 8px;
      padding: 16px 20px;
      margin-top: 20px;
      text-align: left;
      line-height: 1.9;
    }
    .tip-box p { font-size: 0.78rem; color: #5e8a76; }
    .tip-box strong { color: #d0e4da; }
    kbd {
      background: rgba(94, 138, 118, 0.15);
      border: 1px solid #1a2e25;
      border-radius: 3px;
      padding: 1px 6px;
      font-family: monospace;
      font-size: 0.7rem;
      color: #10b981;
    }
    code { color: #60a5fa; font-family: monospace; }
    .divider { border: none; border-top: 1px solid #1a2e25; margin: 16px 0; }
    .status-box {
      background: #070b09;
      border: 1px solid #1a2e25;
      border-radius: 6px;
      padding: 10px 14px;
      margin-top: 10px;
      font-size: 0.75rem;
      font-family: monospace;
      line-height: 1.7;
      text-align: left;
      max-height: 160px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>
      Vue 编译器 Debugger
      <small>先打开 F12 → 按顺序点击按钮逐步学习</small>
    </h1>

    <div class="display-area">
      <div class="pipeline">
        <div class="stage" id="stage-template">
          <div class="stage-icon" style="background:rgba(94,138,118,0.15);color:#5e8a76">&lt;/&gt;</div>
          <div class="stage-info">
            <span class="stage-label">Template</span>
            <span class="stage-desc">模板字符串</span>
          </div>
        </div>
        <div class="pipe-arrow" id="arrow-parse">↓</div>
        <div class="stage" id="stage-parse">
          <div class="stage-icon parse">P</div>
          <div class="stage-info">
            <span class="stage-label">Parse</span>
            <span class="stage-desc">解析为 AST</span>
          </div>
        </div>
        <div class="pipe-arrow" id="arrow-transform">↓</div>
        <div class="stage" id="stage-transform">
          <div class="stage-icon transform">T</div>
          <div class="stage-info">
            <span class="stage-label">Transform</span>
            <span class="stage-desc">转换与优化</span>
          </div>
        </div>
        <div class="pipe-arrow" id="arrow-codegen">↓</div>
        <div class="stage" id="stage-codegen">
          <div class="stage-icon codegen">C</div>
          <div class="stage-info">
            <span class="stage-label">Codegen</span>
            <span class="stage-desc">生成渲染函数</span>
          </div>
        </div>
      </div>
      <div class="code-box" id="codeBox"><span class="muted">等待初始化...</span></div>
    </div>

    <div class="btn-group">
      <button class="btn btn-setup" id="setupBtn" onclick="setup()">1. 初始化</button>
      <button class="btn btn-parse" id="parseBtn" onclick="doParse()" disabled>2. Parse</button>
      <button class="btn btn-transform" id="transformBtn" onclick="doTransform()" disabled>3. Transform</button>
      <button class="btn btn-codegen" id="codegenBtn" onclick="doCodegen()" disabled>4. Codegen</button>
    </div>

    <hr class="divider">
    <div class="status-box" id="logArea">
      点击「初始化」开始
    </div>
  </div>

<script>
const template = `<div id="app">
  <p>hello {{ name }}</p>
</div>`

let ast = null

/* ===== Parse ===== */
function parse(templateStr) {
  debugger // ① 进入 parse → 【观察】templateStr 内容，即将解析构建 AST 树

  // 创建 AST 根节点
  const ast = {
    type: 'Root',
    children: []
  }

  debugger // ② Root 节点已创建 → 【观察】ast 结构：{ type:'Root', children:[] }

  // 解析 <div id="app">
  const root = {
    type: 'Element',
    tag: 'div',
    props: { id: 'app' },
    children: [],
    isStatic: true
  }

  debugger // ③ div Element 已创建 → 【观察】tag:'div', props:{id:'app'}, isStatic:true

  // 放入 Root.children
  ast.children.push(root)

  debugger // ④ div 已挂到 Root.children → 【观察】ast.children 现在有 1 个元素

  // 解析 <p>
  const pElem = {
    type: 'Element',
    tag: 'p',
    props: {},
    children: [],
    isStatic: false
  }

  debugger // ⑤ p Element 已创建 → 【观察】tag:'p', isStatic:false（因包含动态插值）

  // 解析普通文本 hello
  const textNode = {
    type: 'Text',
    content: 'hello ',
    isStatic: true
  }

  debugger // ⑥ Text 节点已创建 → 【观察】type:'Text', content:'hello ', isStatic:true

  // 放入 p.children
  pElem.children.push(textNode)

  debugger // ⑦ Text 已加入 p.children → 【观察】pElem.children 现在有 1 个元素

  // 解析 {{ name }}
  const interpolationNode = {
    type: 'Interpolation',
    content: {
      type: 'Expression',
      content: 'name'
    },
    isStatic: false
  }

  debugger // ⑧ Interpolation 节点已创建 → 【观察】type:'Interpolation', content:'name'

  // 放入 p.children
  pElem.children.push(interpolationNode)

  debugger // ⑨ Interpolation 已加入 p.children → 【观察】pElem.children 有 2 个元素

  // p 放入 div.children
  root.children.push(pElem)

  debugger // ⑩ p 已加入 div.children → 【观察】root.children 有 1 个元素

  debugger // ⑪ AST 构建完成 → 【观察】完整 AST 结构：Root > div > p > Text + Interpolation

  return ast
}

/* ===== Transform ===== */
function transform(ast) {
  debugger // ① 进入 transform → 【观察】即将递归遍历 AST，给每个节点打补丁标记

  function traverseNode(node) {
    debugger // ② 正在访问节点 → 【观察】当前 node.type 是什么？(Root/Element/Text/Interpolation)

    // Root / Element 才有 children
    if (node.children) {
      node.children.forEach(child => {
        debugger // ③ 准备递归 → 【观察】即将进入子节点（深度优先遍历）
        traverseNode(child)
      })
    }

    // 模拟 Vue 编译优化
    if (node.type === 'Text') {
      debugger // ④ Text 节点 → 【观察】标记 hoist=true（静态提升，不参与更新）
      node.hoist = true
    }

    if (node.type === 'Interpolation') {
      debugger // ⑤ Interpolation → 【观察】标记 patchFlag='TEXT'（动态文本，需要更新）
      node.patchFlag = 'TEXT'
    }

    if (node.type === 'Element') {
      debugger // ⑥ Element → 【观察】isStatic 决定 patchFlag 是 STATIC 还是 DYNAMIC
      node.patchFlag = node.isStatic ? 'STATIC' : 'DYNAMIC'
    }

    debugger // ⑦ 当前节点处理完成 → 【观察】此时 node 已带有 hoist/patchFlag 标记
  }

  traverseNode(ast)

  debugger // ⑧ transform 全部完成 → 【观察】AST 中每个节点都多了优化标记

  return ast
}

/* ===== Codegen ===== */
function codegen(ast) {
  debugger // ① 进入 codegen → 【观察】根据 AST 生成 render 函数字符串

  // 模拟 Vue 生成 render 代码
  let code = `
function render() {
  return h('div', { id: "app" }, [
    h('p', null, [
      "hello ",
      _ctx.name
    ])
  ])
}
`.trim()

  debugger // ② render 函数已生成 → 【观察】生成的代码与原始 template 对比
  // 模板：<div><p>hello {{ name }}</p></div> → render 中用 _ctx.name 引用动态变量

  return code
}

/* ===== 阶段更新 ===== */
function setStage(stage, state) {
  const el = document.getElementById('stage-' + stage)

  if (state === 'active') {
    el.className = 'stage active'
  } else if (state === 'processing') {
    el.className = 'stage processing'
  } else {
    el.className = 'stage'
  }
}

/* ===== 按钮操作 ===== */
function setup() {
  debugger // ① 初始化 → 【观察】准备展示 template 字符串，解锁 Parse 按钮

  document.getElementById('setupBtn').disabled = true

  setStage('template', 'active')

  debugger // ② template 已显示 → 【观察】代码框中是原始模板字符串

  document.getElementById('codeBox').innerHTML =
    `<span class="muted">模板:</span> ${template.replace(/</g, '&lt;')}`

  document.getElementById('parseBtn').disabled = false

  debugger // ③ Parse 按钮已解锁 → 点击「Parse」进入编译第一阶段

  log('初始化完成，模板已就绪')
}

function doParse() {
  debugger // ① 点击 Parse → 【观察】即将进入 parse() 函数构建 AST

  document.getElementById('parseBtn').disabled = true

  setStage('parse', 'processing')
  document.getElementById('arrow-parse').className = 'pipe-arrow active'

  debugger // ② Parse 阶段已高亮 → 【观察】UI 上的 Parse 阶段标记变绿

  ast = parse(template)

  debugger // ③ parse() 已返回 AST → 【观察】ast 是完整的 AST 树结构

  setStage('parse', 'active')

  document.getElementById('codeBox').innerHTML =
`<span class="key">AST:</span>
<span class="muted">Root</span>
  <span class="kw">Element</span> <span class="str">div</span>
    <span class="key">props</span>: { id: <span class="str">"app"</span> }
    <span class="kw">Element</span> <span class="str">p</span>
      <span class="muted">Text</span> <span class="str">"hello "</span>
      <span class="muted">Interpolation</span> {
        <span class="key">content</span>: <span class="fn">name</span>
      }`

  debugger // ④ AST 已展示到页面 → 【观察】代码框中显示了 AST 的层级结构

  document.getElementById('transformBtn').disabled = false

  debugger // ⑤ Transform 按钮已解锁 → 点击进入编译优化阶段

  log('Parse 完成 → AST 已构建')
}

function doTransform() {
  debugger // ① 点击 Transform → 【观察】即将遍历 AST，给节点添加优化标记

  document.getElementById('transformBtn').disabled = true

  setStage('transform', 'processing')
  document.getElementById('arrow-transform').className = 'pipe-arrow active'

  debugger // ② Transform 阶段已高亮

  transform(ast)

  debugger // ③ transform() 执行完成 → 【观察】AST 节点已打上 patchFlag/hoist 标记

  setStage('transform', 'active')

  document.getElementById('codeBox').innerHTML =
`<span class="key">Transformed AST</span>

<span class="muted">Root</span>

<span class="muted">div</span>
  → patchFlag: STATIC

  <span class="muted">p</span>
    → patchFlag: DYNAMIC

    <span class="muted">Text "hello "</span>
      → hoistStatic

    <span class="muted">Interpolation name</span>
      → patchFlag: TEXT`

  debugger // ④ 优化信息已显示 → 【观察】静态节点标记了 hoist/patchFlag，动态节点标记了 TEXT

  document.getElementById('codegenBtn').disabled = false

  debugger // ⑤ Codegen 按钮已解锁 → 点击进入代码生成阶段

  log('Transform 完成 → 节点已优化')
}

function doCodegen() {
  debugger // ① 点击 Codegen → 【观察】即将根据优化后的 AST 生成 render 函数

  document.getElementById('codegenBtn').disabled = true

  setStage('codegen', 'processing')
  document.getElementById('arrow-codegen').className = 'pipe-arrow active'

  debugger // ② Codegen 阶段已高亮

  const code = codegen(ast)

  debugger // ③ render 函数已生成 → 【观察】code 是字符串形式的 render 函数

  setStage('codegen', 'active')

  document.getElementById('codeBox').innerHTML =
`<span class="kw">function</span> <span class="fn">render</span>() {
  <span class="kw">return</span> <span class="fn">h</span>(
    <span class="str">'div'</span>,
    { <span class="key">id</span>: <span class="str">"app"</span> },
    [
      <span class="fn">h</span>(
        <span class="str">'p'</span>,
        <span class="kw">null</span>,
        [
          <span class="str">"hello "</span>,
          <span class="muted">_ctx</span>.name
        ]
      )
    ]
  )
}`

  debugger // ④ render 函数已展示到页面 → 【观察】最终生成的渲染函数，可直接用于虚拟 DOM 渲染
  // 完整流程：Template → Parse(构建AST) → Transform(优化标记) → Codegen(生成render)

  log('Codegen 完成 → 渲染函数已生成！')
}

function log(msg) {
  const area = document.getElementById('logArea')
  const t = new Date().toLocaleTimeString()

  area.innerHTML = `[${t}] ${msg}<br>` + area.innerHTML
}
</script>
</body>
</html>
