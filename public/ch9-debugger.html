<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>手写Vue3编译器（Debugger版）</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Noto Sans SC', system-ui, -apple-system, sans-serif;
      background: #070b09;
      color: #d0e4da;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 20px;
    }
    .box {
      background: #0d1612;
      border: 1px solid #1a2e25;
      border-radius: 12px;
      padding: 40px 48px;
      text-align: center;
      max-width: 600px;
      width: 100%;
    }
    .box h1 {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 6px;
      color: #d0e4da;
    }
    .box h1 small {
      display: block;
      font-size: 0.72rem;
      font-weight: 400;
      color: #5e8a76;
      margin-top: 6px;
    }
    .display-area {
      margin: 24px 0;
      padding: 20px;
      background: #0a100d;
      border: 1px solid #1a2e25;
      border-radius: 8px;
    }
    .display-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      margin: 6px 0;
    }
    .display-label { font-size: 0.78rem; color: #5e8a76; }
    .pipeline {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }
    .stage {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      background: rgba(7,11,9,0.4);
      border: 1px solid #1a2e25;
      border-radius: 8px;
      transition: all 0.4s;
      opacity: 0.35;
    }
    .stage.active { opacity: 0.8; border-color: rgba(94,138,118,0.4); }
    .stage.processing { opacity: 1; border-color: rgba(16,185,129,0.6); background: rgba(16,185,129,0.06); }
    .stage-icon {
      width: 32px; height: 32px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.75rem; flex-shrink: 0;
    }
    .stage-icon.parse { background: rgba(96,165,250,0.12); color: #60a5fa; }
    .stage-icon.transform { background: rgba(139,92,246,0.12); color: #8b5cf6; }
    .stage-icon.codegen { background: rgba(239,68,68,0.12); color: #ef4444; }
    .stage-info { display: flex; flex-direction: column; gap: 2px; flex: 1; text-align: left; }
    .stage-label { font-weight: 700; font-size: 0.82rem; }
    .stage-desc { font-size: 0.62rem; color: #5e8a76; }
    .pipe-arrow { color: rgba(94,138,118,0.2); padding: 4px 0; }
    .pipe-arrow.active { color: #10b981; }
    .code-box {
      margin-top: 10px;
      background: #070b09;
      border: 1px solid #1a2e25;
      border-radius: 6px;
      padding: 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      text-align: left;
      line-height: 1.6;
      min-height: 40px;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .code-box .kw { color: #7dd3a8; }
    .code-box .fn { color: #fbbf24; }
    .code-box .str { color: #f0a85e; }
    .code-box .key { color: #60a5fa; }
    .code-box .muted { color: #5e8a76; }
    .btn-group {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin: 20px 0;
      flex-wrap: wrap;
    }
    .btn {
      padding: 10px 18px;
      font-size: 0.82rem;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
      color: white;
    }
    .btn-setup { background: linear-gradient(135deg, #6b7280, #9ca3af); }
    .btn-setup:hover { box-shadow: 0 4px 20px rgba(156, 163, 175, 0.35); transform: translateY(-1px); }
    .btn-parse { background: linear-gradient(135deg, #2563eb, #60a5fa); box-shadow: 0 2px 12px rgba(96, 165, 250, 0.2); }
    .btn-parse:hover { box-shadow: 0 4px 20px rgba(96, 165, 250, 0.35); transform: translateY(-1px); }
    .btn-transform { background: linear-gradient(135deg, #7c3aed, #a78bfa); box-shadow: 0 2px 12px rgba(167, 139, 250, 0.2); }
    .btn-transform:hover { box-shadow: 0 4px 20px rgba(167, 139, 250, 0.35); transform: translateY(-1px); }
    .btn-codegen { background: linear-gradient(135deg, #dc2626, #ef4444); box-shadow: 0 2px 12px rgba(239, 68, 68, 0.2); }
    .btn-codegen:hover { box-shadow: 0 4px 20px rgba(239, 68, 68, 0.35); transform: translateY(-1px); }
    .btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none !important; }
    .tip-box {
      background: #0a100d;
      border: 1px solid #1a2e25;
      border-radius: 8px;
      padding: 16px 20px;
      margin-top: 20px;
      text-align: left;
      line-height: 1.9;
    }
    .tip-box p { font-size: 0.78rem; color: #5e8a76; }
    .tip-box strong { color: #d0e4da; }
    kbd {
      background: rgba(94, 138, 118, 0.15);
      border: 1px solid #1a2e25;
      border-radius: 3px;
      padding: 1px 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      color: #10b981;
    }
    code { color: #60a5fa; font-family: 'JetBrains Mono', monospace; }
    .divider { border: none; border-top: 1px solid #1a2e25; margin: 16px 0; }
    .status-box {
      background: #070b09;
      border: 1px solid #1a2e25;
      border-radius: 6px;
      padding: 10px 14px;
      margin-top: 10px;
      font-size: 0.75rem;
      font-family: monospace;
      line-height: 1.7;
      text-align: left;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>
      Vue 编译器 Debugger
      <small>先打开 F12 → 按顺序点击按钮逐步学习</small>
    </h1>

    <div class="display-area">
      <div class="pipeline">
        <div class="stage" id="stage-template">
          <div class="stage-icon" style="background:rgba(94,138,118,0.15);color:#5e8a76">&lt;/&gt;</div>
          <div class="stage-info">
            <span class="stage-label">Template</span>
            <span class="stage-desc">模板字符串</span>
          </div>
        </div>
        <div class="pipe-arrow" id="arrow-parse">↓</div>
        <div class="stage" id="stage-parse">
          <div class="stage-icon parse">P</div>
          <div class="stage-info">
            <span class="stage-label">Parse</span>
            <span class="stage-desc">解析为 AST</span>
          </div>
        </div>
        <div class="pipe-arrow" id="arrow-transform">↓</div>
        <div class="stage" id="stage-transform">
          <div class="stage-icon transform">T</div>
          <div class="stage-info">
            <span class="stage-label">Transform</span>
            <span class="stage-desc">转换与优化</span>
          </div>
        </div>
        <div class="pipe-arrow" id="arrow-codegen">↓</div>
        <div class="stage" id="stage-codegen">
          <div class="stage-icon codegen">C</div>
          <div class="stage-info">
            <span class="stage-label">Codegen</span>
            <span class="stage-desc">生成渲染函数</span>
          </div>
        </div>
      </div>
      <div class="code-box" id="codeBox"><span class="muted">等待初始化...</span></div>
    </div>

    <div class="btn-group">
      <button class="btn btn-setup" id="setupBtn" onclick="setup()">1. 初始化</button>
      <button class="btn btn-parse" id="parseBtn" onclick="doParse()" disabled>2. Parse</button>
      <button class="btn btn-transform" id="transformBtn" onclick="doTransform()" disabled>3. Transform</button>
      <button class="btn btn-codegen" id="codegenBtn" onclick="doCodegen()" disabled>4. Codegen</button>
    </div>

    <hr class="divider">
    <div class="status-box" id="logArea">
      点击「初始化」开始
    </div>
  </div>

<script>
const template = `<div id="app">
  <p>hello {{ name }}</p>
</div>`

let ast = null

/* ===== Parse ===== */
function parse(templateStr) {
  debugger // ① 进入 parse：开始解析 template 字符串

  // 创建 AST 根节点
  const ast = {
    type: 'Root',
    children: []
  }

  debugger // ② Root 节点已创建

  // 解析 <div id="app">
  const root = {
    type: 'Element',
    tag: 'div',
    props: { id: 'app' },
    children: [],
    isStatic: true
  }

  debugger // ③ div Element 节点已创建

  // 放入 Root.children
  ast.children.push(root)

  debugger // ④ div 已挂到 Root.children

  // 解析 <p>
  const pElem = {
    type: 'Element',
    tag: 'p',
    props: {},
    children: [],
    isStatic: false
  }

  debugger // ⑤ p Element 节点已创建

  // 解析普通文本 hello
  const textNode = {
    type: 'Text',
    content: 'hello ',
    isStatic: true
  }

  debugger // ⑥ Text 节点已创建

  // 放入 p.children
  pElem.children.push(textNode)

  debugger // ⑦ Text 已加入 p.children

  // 解析 {{ name }}
  const interpolationNode = {
    type: 'Interpolation',
    content: {
      type: 'Expression',
      content: 'name'
    },
    isStatic: false
  }

  debugger // ⑧ Interpolation 节点已创建

  // 放入 p.children
  pElem.children.push(interpolationNode)

  debugger // ⑨ Interpolation 已加入 p.children

  // p 放入 div.children
  root.children.push(pElem)

  debugger // ⑩ p 已加入 div.children

  debugger // ⑪ AST 构建完成

  return ast
}

/* ===== Transform ===== */
function transform(ast) {
  debugger // ① 进入 transform：开始遍历 AST

  function traverseNode(node) {
    debugger // ② 正在访问节点

    // Root / Element 才有 children
    if (node.children) {
      node.children.forEach(child => {
        debugger // ③ 准备递归进入子节点
        traverseNode(child)
      })
    }

    // 模拟 Vue 编译优化
    if (node.type === 'Text') {
      debugger // ④ Text 节点：标记静态提升
      node.hoist = true
    }

    if (node.type === 'Interpolation') {
      debugger // ⑤ Interpolation：标记为动态节点
      node.patchFlag = 'TEXT'
    }

    if (node.type === 'Element') {
      debugger // ⑥ Element：分析是否静态
      node.patchFlag = node.isStatic ? 'STATIC' : 'DYNAMIC'
    }

    debugger // ⑦ 当前节点处理完成，准备返回上一层
  }

  traverseNode(ast)

  debugger // ⑧ transform 全部完成

  return ast
}

/* ===== Codegen ===== */
function codegen(ast) {
  debugger // ① 进入 codegen：开始根据 AST 生成 render 函数

  // 模拟 Vue 生成 render 代码
  let code = `
function render() {
  return h('div', { id: "app" }, [
    h('p', null, [
      "hello ",
      _ctx.name
    ])
  ])
}
`.trim()

  debugger // ② render 函数代码字符串已生成

  return code
}

/* ===== 阶段更新 ===== */
function setStage(stage, state) {
  const el = document.getElementById('stage-' + stage)

  if (state === 'active') {
    el.className = 'stage active'
  } else if (state === 'processing') {
    el.className = 'stage processing'
  } else {
    el.className = 'stage'
  }
}

/* ===== 按钮操作 ===== */
function setup() {
  debugger // ① 初始化页面

  document.getElementById('setupBtn').disabled = true

  setStage('template', 'active')

  debugger // ② template 已准备显示

  document.getElementById('codeBox').innerHTML =
    `<span class="muted">模板:</span> ${template.replace(/</g, '&lt;')}`

  document.getElementById('parseBtn').disabled = false

  debugger // ③ Parse 按钮已解锁

  log('初始化完成，模板已就绪')
}

function doParse() {
  debugger // ① 点击 Parse：开始 parse 阶段

  document.getElementById('parseBtn').disabled = true

  setStage('parse', 'processing')
  document.getElementById('arrow-parse').className = 'pipe-arrow active'

  debugger // ② parse 阶段 UI 已高亮

  ast = parse(template)

  debugger // ③ parse() 已返回 AST

  setStage('parse', 'active')

  document.getElementById('codeBox').innerHTML =
`<span class="key">AST:</span>
<span class="muted">Root</span>
  <span class="kw">Element</span> <span class="str">div</span>
    <span class="key">props</span>: { id: <span class="str">"app"</span> }
    <span class="kw">Element</span> <span class="str">p</span>
      <span class="muted">Text</span> <span class="str">"hello "</span>
      <span class="muted">Interpolation</span> {
        <span class="key">content</span>: <span class="fn">name</span>
      }`

  debugger // ④ AST 已渲染到页面

  document.getElementById('transformBtn').disabled = false

  debugger // ⑤ Transform 按钮已解锁

  log('Parse 完成 → AST 已构建')
}

function doTransform() {
  debugger // ① 点击 Transform：开始 AST 优化

  document.getElementById('transformBtn').disabled = true

  setStage('transform', 'processing')
  document.getElementById('arrow-transform').className = 'pipe-arrow active'

  debugger // ② transform 阶段 UI 已高亮

  transform(ast)

  debugger // ③ transform() 执行完成

  setStage('transform', 'active')

  document.getElementById('codeBox').innerHTML =
`<span class="key">Transformed AST</span>

<span class="muted">Root</span>

<span class="muted">div</span>
  → patchFlag: STATIC

  <span class="muted">p</span>
    → patchFlag: DYNAMIC

    <span class="muted">Text "hello "</span>
      → hoistStatic

    <span class="muted">Interpolation name</span>
      → patchFlag: TEXT`

  debugger // ④ 优化信息已显示

  document.getElementById('codegenBtn').disabled = false

  debugger // ⑤ Codegen 按钮已解锁

  log('Transform 完成 → 节点已优化')
}

function doCodegen() {
  debugger // ① 点击 Codegen：开始生成 render 函数

  document.getElementById('codegenBtn').disabled = true

  setStage('codegen', 'processing')
  document.getElementById('arrow-codegen').className = 'pipe-arrow active'

  debugger // ② codegen 阶段 UI 已高亮

  const code = codegen(ast)

  debugger // ③ render 函数代码已生成

  setStage('codegen', 'active')

  document.getElementById('codeBox').innerHTML =
`<span class="kw">function</span> <span class="fn">render</span>() {
  <span class="kw">return</span> <span class="fn">h</span>(
    <span class="str">'div'</span>,
    { <span class="key">id</span>: <span class="str">"app"</span> },
    [
      <span class="fn">h</span>(
        <span class="str">'p'</span>,
        <span class="kw">null</span>,
        [
          <span class="str">"hello "</span>,
          <span class="muted">_ctx</span>.name
        ]
      )
    ]
  )
}`

  debugger // ④ render 函数已显示到页面

  log('Codegen 完成 → 渲染函数已生成！')
}

function log(msg) {
  const area = document.getElementById('logArea')
  const t = new Date().toLocaleTimeString()

  area.innerHTML = `[${t}] ${msg}\n` + area.innerHTML
}
</script>
</body>
</html>
