<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vue 嵌套 Effect（Debugger版）</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: system-ui, sans-serif;
  background:#070b09;
  color:#d0e4da;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  padding:40px 20px;
}
.box {
  width:560px;
  background:#0d1612;
  border:1px solid #1a2e25;
  border-radius:12px;
  padding:40px;
  text-align:center;
}
.display {
  background:#0a100d;
  border:1px solid #1a2e25;
  padding:16px;
  border-radius:8px;
  margin:20px 0;
  font-family:monospace;
}
.val { margin:6px 0; }
.text { color:#10b981; font-size:20px; }
.active { color:#60a5fa; }
.stack-vis {
  background:#070b09;
  border:1px solid #1a2e25;
  border-radius:6px;
  padding:10px;
  margin:10px 0;
  text-align:left;
  font-size:0.72rem;
  line-height:1.6;
}
.stack-item { padding:4px 8px; border-radius:4px; border-left:3px solid transparent; }
.stack-item.active { border-left-color:#10b981; background:rgba(16,185,129,0.06); color:#10b981; }
.stack-item.inactive { color:#5e8a76; opacity:0.5; }

button {
  margin:6px;
  padding:10px 14px;
  border:none;
  border-radius:8px;
  font-weight:700;
  color:white;
  cursor:pointer;
}
.init { background:#6b7280; }
.effect { background:#10b981; }
.problem { background:#ef4444; }
.solution { background:#7c3aed; }
.change { background:#2563eb; }
button:disabled { opacity:0.4; }

.log {
  margin-top:16px;
  background:#070b09;
  border:1px solid #1a2e25;
  border-radius:6px;
  padding:10px;
  font-size:0.75rem;
  font-family:monospace;
  text-align:left;
  line-height:1.7;
}
</style>
</head>
<body>

<div class="box">
  <h1>Vue 嵌套 Effect Debugger</h1>

  <div class="display">
    <div class="val text">state.text: <span id="textVal">"Hello"</span></div>
    <div class="val active">activeEffect: <span id="activeEffectVal">null</span></div>
    <div class="stack-vis" id="stackVis">
      <div class="stack-item inactive">（空）</div>
    </div>
  </div>

  <button class="init" onclick="setup()" id="setupBtn">1. 初始化</button>
  <button class="effect" onclick="createEffects()" id="effectBtn" disabled>2. 创建嵌套 effect</button>
  <button class="problem" onclick="showProblem()" id="problemBtn" disabled>3. 覆盖问题演示</button>
  <button class="solution" onclick="showSolution()" id="solutionBtn" disabled>4. EffectStack 解决</button>
  <button class="change" onclick="changeText()" id="changeBtn" disabled>5. 修改数据</button>

  <div class="log" id="logArea">
    点击「初始化」开始
  </div>
</div>

<script>
/* ===== 响应式系统（无栈版本 - 有问题）===== */
let activeEffect = null
let effectStack = []
const bucket = new Map()
let state = null

function effectWithoutStack(fn) {
  const effectFn = () => {
    activeEffect = effectFn
    fn()
  }
  effectFn()
  return effectFn
}

/* ===== 改进版 effect（带栈 - 正确版本）===== */
function effectWithStack(fn) {
  const effectFn = () => {

    // ===== 进入 effect =====
    debugger // push 前：即将进入栈

    effectStack.push(effectFn)
    activeEffect = effectFn
    updateStackDisplay()

    debugger // 状态已切换：effectStack + activeEffect 已更新

    fn()

    // ===== effect 执行结束 =====
    debugger // 即将出栈（关键回退点）

    effectStack.pop()
    activeEffect = effectStack[effectStack.length - 1] || null
    updateStackDisplay()

    debugger // 出栈完成：activeEffect 已恢复
  }

  effectFn()
  return effectFn
}

function track(target, key) {
  if (!activeEffect) return

  let depsMap = bucket.get(target)
  if (!depsMap) {
    depsMap = new Map()
    bucket.set(target, depsMap)
  }

  let deps = depsMap.get(key)
  if (!deps) {
    deps = new Set()
    depsMap.set(key, deps)
  }

  deps.add(activeEffect)
}

function trigger(target, key) {
  const depsMap = bucket.get(target)
  if (!depsMap) return

  const effects = depsMap.get(key)
  effects && effects.forEach(fn => fn())
}

function reactive(data) {
  return new Proxy(data, {
    get(target, key) {
      track(target, key)
      return target[key]
    },
    set(target, key, val) {
      target[key] = val
      trigger(target, key)
      return true
    }
  })
}

let effect1, effect2

/* ===== UI 更新 ===== */
function updateStackDisplay() {
  const el = document.getElementById('stackVis')

  if (effectStack.length === 0 && !effect1) {
    el.innerHTML = '<div class="stack-item inactive">（空）</div>'
  } else if (effectStack.length === 0 && effect1) {
    // 栈为空但 effect 已注册
    el.innerHTML = `
      <div class="stack-item inactive">[注册] effect1 ${effect1._name ? '✓' : ''}</div>
      <div class="stack-item inactive">[注册] effect2 ${effect2?._name ? '✓' : ''}</div>
      <div class="stack-item inactive" style="margin-top:6px;color:#5e8a76">（栈为空 — 无正在执行的 effect）</div>
    `
  } else {
    el.innerHTML = effectStack.map((fn, i) => {
      const isActive = i === effectStack.length - 1
      const name = fn._name || `effect${i + 1}`

      return `<div class="stack-item ${isActive ? 'active' : 'inactive'}">
        [${i}] ${name} ${isActive ? '← activeEffect' : ''}
      </div>`
    }).join('')
  }

  document.getElementById('activeEffectVal').innerText =
    activeEffect ? (activeEffect._name || 'effect') : 'null'
}

/* ===== 初始化 ===== */
function setup() {
  document.getElementById('setupBtn').disabled = true
  state = reactive({ text: 'Hello' })
  document.getElementById('effectBtn').disabled = false
  updateDisplay()
  log('初始化完成')
}

/* ===== 创建嵌套 effect ===== */
function createEffects() {

  debugger // 开始创建嵌套 effect（关键入口）

  document.getElementById('effectBtn').disabled = true

  effect1 = effectWithStack(() => {

    debugger // effect1 执行开始（外层）

    document.getElementById('textVal').innerText = `"${state.text}"`
    updateDisplay()

    effect2 = effectWithStack(() => {

      debugger // effect2 执行开始（内层嵌套）

      document.getElementById('textVal').innerText = `"${state.text}"`
      updateDisplay()

      debugger // effect2 执行结束

    })

    effect2._name = 'effect2'

    debugger // effect1 继续执行（此时 effect2 已注册）

  })

  effect1._name = 'effect1'

  // 刷新栈显示（effect 执行完后 _name 才赋值）
  updateStackDisplay()

  document.getElementById('problemBtn').disabled = false
  log('嵌套 effect 已创建（effectStack版本）')
}

/* ===== 覆盖问题演示 ===== */
function showProblem() {

  debugger // 进入"无栈版本问题演示"

  document.getElementById('problemBtn').disabled = true
  log('--- 无栈版本：activeEffect 覆盖问题 ---')

  const oldBucket = new Map()
  let oldActive = null

  const oldEffect = (fn) => {
    const ef = () => {
      oldActive = ef
      fn()
    }
    ef._name = fn._name || 'anonymous'
    ef()
    return ef
  }

  const oldTrack = (target, key) => {
    if (!oldActive) return

    let depsMap = oldBucket.get(target)
    if (!depsMap) {
      depsMap = new Map()
      oldBucket.set(target, depsMap)
    }

    let deps = depsMap.get(key)
    if (!deps) {
      deps = new Set()
      depsMap.set(key, deps)
    }

    deps.add(oldActive)
  }

  const oldReactive = (data) =>
    new Proxy(data, {
      get(t, k) {
        oldTrack(t, k)
        return t[k]
      },
      set(t, k, v) {
        t[k] = v

        const depsMap = oldBucket.get(t)
        if (depsMap) {
          const deps = depsMap.get(k)
          deps && deps.forEach(fn => fn())
        }

        return true
      }
    })

  const oldState = oldReactive({ text: 'Hello' })

  debugger // effect1 开始执行（无栈）

  oldEffect(() => {

    debugger // effect1 active

    const _ = oldState.text

    oldEffect(() => {

      debugger // effect2 覆盖 oldActive

      const _2 = oldState.text

    })

    debugger // 回到 effect1，但 oldActive 已被污染

    const _3 = oldState.text

  })

  debugger // 问题结束点

  log('问题：无栈导致 activeEffect 被覆盖')
  document.getElementById('solutionBtn').disabled = false
}

/* ===== 解决方案 ===== */
function showSolution() {

  debugger // 切换到 effectStack 正确模型

  document.getElementById('solutionBtn').disabled = true
  document.getElementById('changeBtn').disabled = false

  log('使用 effectStack：解决嵌套覆盖问题')
}

/* ===== 修改数据 ===== */
function changeText() {

  debugger // trigger 触发入口

  state.text = 'World'

  debugger // setter 触发 trigger，effects 队列开始执行

  updateDisplay()

  log(`state.text → "World"`)
}

/* ===== UI ===== */
function updateDisplay() {
  if (!state) return
  document.getElementById('textVal').innerText = `"${state.text}"`
}

function log(msg) {
  const area = document.getElementById('logArea')
  const t = new Date().toLocaleTimeString()
  area.innerHTML = `[${t}] ${msg}<br>` + area.innerHTML
}
</script>

</body>
</html>
