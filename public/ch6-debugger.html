<script>
/* ===== 响应式系统（无栈版本 - 有问题）===== */
let activeEffect = null
let effectStack = []
const bucket = new Map()
let state = null

function effectWithoutStack(fn) {
  const effectFn = () => {
    activeEffect = effectFn
    fn()
  }
  effectFn()
  return effectFn
}

/* ===== 改进版 effect（带栈 - 正确版本）===== */
function effectWithStack(fn) {
  const effectFn = () => {

    // ===== 进入 effect =====
    debugger // push 前：即将进入栈

    effectStack.push(effectFn)
    activeEffect = effectFn
    updateStackDisplay()

    debugger // 状态已切换：effectStack + activeEffect 已更新

    fn()

    // ===== effect 执行结束 =====
    debugger // 即将出栈（关键回退点）

    effectStack.pop()
    activeEffect = effectStack[effectStack.length - 1] || null
    updateStackDisplay()

    debugger // 出栈完成：activeEffect 已恢复
  }

  effectFn()
  return effectFn
}

function track(target, key) {
  if (!activeEffect) return

  let depsMap = bucket.get(target)
  if (!depsMap) {
    depsMap = new Map()
    bucket.set(target, depsMap)
  }

  let deps = depsMap.get(key)
  if (!deps) {
    deps = new Set()
    depsMap.set(key, deps)
  }

  deps.add(activeEffect)
}

function trigger(target, key) {
  const depsMap = bucket.get(target)
  if (!depsMap) return

  const effects = depsMap.get(key)
  effects && effects.forEach(fn => fn())
}

function reactive(data) {
  return new Proxy(data, {
    get(target, key) {
      track(target, key)
      return target[key]
    },
    set(target, key, val) {
      target[key] = val
      trigger(target, key)
      return true
    }
  })
}

let effect1, effect2

/* ===== UI 更新 ===== */
function updateStackDisplay() {
  const el = document.getElementById('stackVis')

  if (effectStack.length === 0) {
    el.innerHTML = '<div class="stack-item inactive">（空）</div>'
  } else {
    el.innerHTML = effectStack.map((fn, i) => {
      const isActive = i === effectStack.length - 1
      const name = fn._name || `effect${i + 1}`

      return `<div class="stack-item ${isActive ? 'active' : 'inactive'}">
        [${i}] ${name} ${isActive ? '← activeEffect' : ''}
      </div>`
    }).join('')
  }

  document.getElementById('activeEffectVal').innerText =
    activeEffect ? (activeEffect._name || 'effect') : 'null'
}

/* ===== 初始化 ===== */
function setup() {
  document.getElementById('setupBtn').disabled = true
  state = reactive({ text: 'Hello' })
  document.getElementById('effectBtn').disabled = false
  updateDisplay()
  log('初始化完成')
}

/* ===== 创建嵌套 effect ===== */
function createEffects() {

  debugger // 开始创建嵌套 effect（关键入口）

  document.getElementById('effectBtn').disabled = true

  effect1 = effectWithStack(() => {

    debugger // effect1 执行开始（外层）

    document.getElementById('textVal').innerText = `"${state.text}"`
    updateDisplay()

    effect2 = effectWithStack(() => {

      debugger // effect2 执行开始（内层嵌套）

      document.getElementById('textVal').innerText = `"${state.text}"`
      updateDisplay()

      debugger // effect2 执行结束

    })

    effect2._name = 'effect2'

    debugger // effect1 继续执行（此时 effect2 已注册）

  })

  effect1._name = 'effect1'

  document.getElementById('problemBtn').disabled = false
  log('嵌套 effect 已创建（effectStack版本）')
}

/* ===== 覆盖问题演示 ===== */
function showProblem() {

  debugger // 进入“无栈版本问题演示”

  document.getElementById('problemBtn').disabled = true
  log('--- 无栈版本：activeEffect 覆盖问题 ---')

  const oldBucket = new Map()
  let oldActive = null

  const oldEffect = (fn) => {
    const ef = () => {
      oldActive = ef
      fn()
    }
    ef._name = fn._name || 'anonymous'
    ef()
    return ef
  }

  const oldTrack = (target, key) => {
    if (!oldActive) return

    let depsMap = oldBucket.get(target)
    if (!depsMap) {
      depsMap = new Map()
      oldBucket.set(target, depsMap)
    }

    let deps = depsMap.get(key)
    if (!deps) {
      deps = new Set()
      depsMap.set(key, deps)
    }

    deps.add(oldActive)
  }

  const oldReactive = (data) =>
    new Proxy(data, {
      get(t, k) {
        oldTrack(t, k)
        return t[k]
      },
      set(t, k, v) {
        t[k] = v

        const depsMap = oldBucket.get(t)
        if (depsMap) {
          const deps = depsMap.get(k)
          deps && deps.forEach(fn => fn())
        }

        return true
      }
    })

  const oldState = oldReactive({ text: 'Hello' })

  debugger // effect1 开始执行（无栈）

  oldEffect(() => {

    debugger // effect1 active

    const _ = oldState.text

    oldEffect(() => {

      debugger // effect2 覆盖 oldActive

      const _2 = oldState.text

    })

    debugger // 回到 effect1，但 oldActive 已被污染

    const _3 = oldState.text

  })

  debugger // 问题结束点

  log('问题：无栈导致 activeEffect 被覆盖')
  document.getElementById('solutionBtn').disabled = false
}

/* ===== 解决方案 ===== */
function showSolution() {

  debugger // 切换到 effectStack 正确模型

  document.getElementById('solutionBtn').disabled = true
  document.getElementById('changeBtn').disabled = false

  log('使用 effectStack：解决嵌套覆盖问题')
}

/* ===== 修改数据 ===== */
function changeText() {

  debugger // trigger 触发入口

  state.text = 'World'

  debugger // effect 执行链开始

  updateDisplay()

  log(`state.text → "World"`)
}

/* ===== UI ===== */
function updateDisplay() {
  if (!state) return
  document.getElementById('textVal').innerText = `"${state.text}"`
}

function log(msg) {
  const area = document.getElementById('logArea')
  const t = new Date().toLocaleTimeString()
  area.innerHTML = `[${t}] ${msg}\n` + area.innerHTML + '<br>'
}
</script>
