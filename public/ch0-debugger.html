<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vue Debugger 入门练习</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: system-ui, sans-serif;
  background: #070b09;
  color: #d0e4da;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 40px 20px;
}
.box {
  width: 600px;
  background: #0d1612;
  border: 1px solid #1a2e25;
  border-radius: 12px;
  padding: 40px;
  text-align: center;
}
h1 {
  font-size: 1.3rem;
  margin-bottom: 4px;
}
.subtitle {
  color: #5e8a76;
  font-size: 0.78rem;
  margin-bottom: 20px;
}
.visual {
  background: #0a100d;
  border: 1px solid #1a2e25;
  border-radius: 8px;
  padding: 16px;
  margin-bottom: 18px;
  text-align: left;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.78rem;
  line-height: 1.8;
  min-height: 80px;
}
.visual .label { color: #5e8a76; }
.visual .val { color: #10b981; }
.visual .highlight { color: #f59e0b; }
.visual .code-line { color: #8b9caa; padding-left: 12px; border-left: 2px solid #1a2e25; margin: 4px 0; }
.visual .code-line.current { border-left-color: #10b981; color: #d0e4da; }

.flow-vis {
  display: flex;
  gap: 6px;
  justify-content: center;
  margin: 10px 0;
  flex-wrap: wrap;
}
.flow-step {
  font-size: 0.65rem;
  padding: 4px 10px;
  border-radius: 4px;
  background: rgba(7,11,9,0.5);
  border: 1px solid #1a2e25;
  color: #5e8a76;
}
.flow-step.active {
  border-color: #10b981;
  color: #10b981;
  background: rgba(16,185,129,0.08);
}
.flow-step.done {
  opacity: 0.35;
}

.btns {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: center;
  margin: 16px 0;
}
button {
  padding: 10px 16px;
  border: none;
  border-radius: 8px;
  font-weight: 700;
  color: white;
  cursor: pointer;
  font-size: 0.82rem;
}
button:disabled { opacity: 0.35; cursor: not-allowed; }
.btn1 { background: #6b7280; }
.btn2 { background: #2563eb; }
.btn3 { background: #7c3aed; }
.btn4 { background: #dc2626; }
.btn5 { background: #10b981; }

.log {
  margin-top: 14px;
  background: #070b09;
  border: 1px solid #1a2e25;
  border-radius: 6px;
  padding: 12px;
  font-family: monospace;
  font-size: 0.72rem;
  text-align: left;
  line-height: 1.8;
  max-height: 120px;
  overflow: auto;
}
kbd {
  display: inline-block;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.7rem;
  color: #10b981;
  background: rgba(16,185,129,0.1);
  border: 1px solid #1a2e25;
  padding: 1px 6px;
  border-radius: 3px;
}
.tip {
  background: rgba(16,185,129,0.06);
  border: 1px solid rgba(16,185,129,0.15);
  border-radius: 6px;
  padding: 10px 14px;
  margin-top: 12px;
  font-size: 0.72rem;
  text-align: left;
  line-height: 1.7;
  color: #8aaa9a;
}
.tip strong { color: #d0e4da; }
</style>
</head>
<body>

<div class="box">
  <h1>调试入门练习</h1>
  <p class="subtitle">第 0 章 · 打开调试工具的source面板，再刷新一下网页</p>

  <div class="visual" id="codeVis">
    <div class="label">代码执行位置</div>
    <div id="currentLine">等待开始…</div>
  </div>

  <div class="flow-vis" id="flowVis">
    <span class="flow-step" id="f1">变量赋值</span>
    <span class="flow-step" id="f2">函数调用</span>
    <span class="flow-step" id="f3">Scope 面板</span>
    <span class="flow-step" id="f4">调用栈</span>
  </div>

  <div class="btns">
    <button class="btn1" id="startBtn" onclick="start()">开始（变量 F10）</button>
    <button class="btn2" id="stepBtn" onclick="doStepOver()" disabled>2. 函数F10：跳过不进函数</button>
    <button class="btn3" id="intoBtn" onclick="doStepInto()" disabled>3. 函数F11：进入函数</button>
    <button class="btn4" id="stackBtn" onclick="doCallStack()" disabled>4. 看调用栈</button>
    <button class="btn5" id="resumeBtn" onclick="doResume()" disabled>5. 试 Resume F8</button>
  </div>

  <div class="tip" id="tipBox">
    <strong>第一步</strong>：点「开始」，按 F10 练习变量
  </div>

  <div class="log" id="logArea">等待开始…</div>
</div>

<script>
let stepCount = 0
let allowGreetDebug = false

function log(msg) {
  const area = document.getElementById('logArea')
  const t = new Date().toLocaleTimeString()
  area.innerHTML = `[${t}] ${msg}<br>` + area.innerHTML
}

function showCode(line, desc) {
  document.getElementById('currentLine').innerHTML = `<span class="highlight">→</span> ${desc}`
}

function tip(msg) {
  document.getElementById('tipBox').innerHTML = msg
}

function activeFlow(id) {
  document.querySelectorAll('.flow-step').forEach(el => {
    el.className = 'flow-step done'
  })
  document.getElementById(id).className = 'flow-step active'
}

function greet(name) {
  if (allowGreetDebug) debugger
  const msg = 'Hello, ' + name
  if (allowGreetDebug) debugger
  return msg
}

function deepFunc(level) {
  debugger
  if (level > 0) return deepFunc(level - 1) + 1
  return 0
}

// ========== 1. 变量练习 ==========
function start() {
  startBtn.disabled = true
  activeFlow('f1')
  showCode('step1', '变量赋值（普通 F10）')
  tip('按 <kbd>F10</kbd>（单行逐行执行），查看局部变量变化')

  // F10(Step Over)：单行执行，默认不进入函数
  debugger
  const a = 1
  const b = 2
  const c = a + b

  // ✅【阶段1完成：按 F8(Resume) 继续运行，再点网页的第二章节的蓝色的按钮】
  debugger

  stepBtn.disabled = false
  intoBtn.disabled = false
  log('✅ 变量 F10 完成')
  tip('✅ 变量练习结束！点【2. 函数F10】')
}

// ========== 2. F10 跳过函数 ==========
function doStepOver() {
  allowGreetDebug = false
  stepBtn.disabled = true
  activeFlow('f2')
  showCode('step2', 'F10 跳过函数：直接拿结果')
  tip('<strong>F10(Step Over)：遇到函数直接执行完毕，不进入内部</strong>')

  // F10(Step Over)：跳过函数内部，直接获取返回值
  debugger
  const result = greet('StepOver')
  
  // ✅【阶段2完成：按 F8(Resume) 继续运行，再点网页的第二章节的紫色的按钮，】
  debugger

  log(`✅ F10 成功：直接拿到结果 = ${result}`)
  tip('✅ F10 演示完成！')
  stackBtn.disabled = false
}

// ========== 3. F11 进入函数 ==========
function doStepInto() {
  allowGreetDebug = true
  intoBtn.disabled = true
  activeFlow('f3')
  showCode('step3', 'F11 进入函数内部')
  tip('<strong>F11(Step Into)：遇到函数直接钻入内部逐行查看</strong>')

  // F11(Step Into)：进入函数内部执行查看细节
  debugger
  const result = greet('StepInto')
  
  // ✅【阶段3完成：按 F8(Resume) 继续运行，再点网页的第二章节的红色的按钮】
  debugger

  log(`✅ F11 完成：result = ${result}`)
  tip('✅ F10 不进函数、F11进函数，基础区分学会！')
}

// ========== 4. 调用栈 ==========
function doCallStack() {
  stackBtn.disabled = true
  activeFlow('f4')
  showCode('step4', '递归调用栈')
  tip('按 <kbd>F11</kbd>(Step Into) 进入递归函数，观察调用栈面板')

  // F11(Step Into)：深入递归函数查看层级
  debugger
  const val = deepFunc(3)
  
  // ✅【阶段4完成：按 F8(Resume) 继续运行，再点网页的第二章节的绿色的按钮】
  debugger

  log(`调用栈结果：deepFunc(3) = ${val}`)
  resumeBtn.disabled = false
}

// ========== 5. Resume F8 ==========
function doResume() {
  resumeBtn.disabled = true
  showCode('step5', 'F8 快速跳转断点')
  tip('多个断点场景，按 <kbd>F8</kbd>(Resume) 直接跳到下一处暂停位置')

  // F8(Resume)：跳过中间代码，直达下一个debugger断点
  debugger
  let x = 1
  x *= 2
  
  // ✅ 按 F8(Resume) 跳到下一个断点，
  debugger
  
  x *= 3
  
  // ✅ 按 F8(Resume) 跳到下一个断点，
  debugger
  
  x *= 4
  
  // ✅ 按 F8(Resume) 跳到下一个断点，
  debugger
  
  const final = x
  
  // ✅【全部教程结束：按 F8(Resume) 结束本次调试，】
  debugger

  log('✅ F8 断点跳转练习完成！')
  tip('🎉 第0章调试入门全部学完，仅掌握 F8/F10/F11 三大核心快捷键')
}
</script>
</body>
</html>
