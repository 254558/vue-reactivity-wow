<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vue Diff（Debugger版）</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, sans-serif;
      background: #070b09;
      color: #d0e4da;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .box {
      width: 100%;
      max-width: 700px;
      background: #0d1612;
      border: 1px solid #1a2e25;
      border-radius: 12px;
      padding: 40px;
    }

    h1 {
      font-size: 1.15rem;
      margin-bottom: 6px;
    }

    h1 small {
      display: block;
      margin-top: 6px;
      color: #5e8a76;
      font-size: 0.72rem;
      font-weight: 400;
    }

    .display-area {
      margin-top: 24px;
      background: #0a100d;
      border: 1px solid #1a2e25;
      border-radius: 8px;
      padding: 20px;
    }

    .node-row {
      margin-bottom: 16px;
    }

    .row-label {
      display: block;
      margin-bottom: 8px;
      color: #5e8a76;
      font-size: 0.72rem;
    }

    .row-cells {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .cell {
      width: 52px;
      height: 46px;
      border-radius: 10px;
      border: 1px solid #1a2e25;
      background: rgba(7,11,9,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      font-family: monospace;
      font-size: 0.95rem;
      font-weight: bold;
      transition: 0.3s;
    }

    .cell.start {
      border-color: #60a5fa;
      background: rgba(96,165,250,0.08);
    }

    .cell.end {
      border-color: #f59e0b;
      background: rgba(245,158,11,0.08);
    }

    .cell.match {
      border-color: #10b981;
      background: rgba(16,185,129,0.08);
    }

    .cell.removed {
      opacity: 0.2;
    }

    .cell.new {
      border-color: #ef4444;
      background: rgba(239,68,68,0.08);
    }

    .idx {
      position: absolute;
      top: 2px;
      right: 4px;
      font-size: 0.5rem;
      color: #5e8a76;
    }

    .compare-box {
      margin: 18px 0;
      padding: 12px;
      border-radius: 8px;
      background: rgba(7,11,9,0.5);
      border: 1px solid #1a2e25;
      text-align: center;
      font-family: monospace;
      font-size: 0.75rem;
      color: #8b5cf6;
      line-height: 1.7;
      min-height: 58px;
    }

    .divider {
      border: none;
      border-top: 1px solid #1a2e25;
      margin: 18px 0;
    }

    .ops-list {
      text-align: left;
      font-family: monospace;
      font-size: 0.72rem;
      line-height: 1.7;
    }

    .op {
      padding: 4px 0 4px 10px;
      border-left: 3px solid #1a2e25;
      margin: 4px 0;
    }

    .op.move {
      border-color: #f59e0b;
      color: #f59e0b;
    }

    .op.add {
      border-color: #60a5fa;
      color: #60a5fa;
    }

    .op.remove {
      border-color: #ef4444;
      color: #ef4444;
    }

    .op.none {
      border-color: #10b981;
      color: #10b981;
    }

    .buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 24px;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-init {
      background: #6b7280;
    }

    .btn-step {
      background: #10b981;
    }

    .btn-auto {
      background: #7c3aed;
    }

    .btn-reset {
      background: #334155;
    }

    .status-box {
      margin-top: 24px;
      padding: 14px;
      border-radius: 8px;
      background: #070b09;
      border: 1px solid #1a2e25;
      font-family: monospace;
      font-size: 0.72rem;
      line-height: 1.8;
      max-height: 180px;
      overflow-y: auto;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>
    Vue Diff Debugger
    <small>F12 → 按顺序点击按钮 → 观察双端 Diff 全流程</small>
  </h1>

  <div class="display-area">

    <div class="node-row">
      <span class="row-label">旧 children</span>
      <div class="row-cells" id="oldCells"></div>
    </div>

    <div class="compare-box" id="compareBox">
      点击「初始化」开始
    </div>

    <div class="node-row">
      <span class="row-label">新 children</span>
      <div class="row-cells" id="newCells"></div>
    </div>

    <hr class="divider">

    <div class="ops-list" id="opsList">
      <div style="color:#5e8a76">（尚未开始）</div>
    </div>

  </div>

  <div class="buttons">
    <button class="btn-init" id="setupBtn" onclick="setup()">
      1. 初始化
    </button>

    <button class="btn-step" id="stepBtn" onclick="diffStep()" disabled>
      2. 单步 Diff
    </button>

    <button class="btn-auto" id="autoBtn" onclick="diffAll()" disabled>
      3. 自动执行
    </button>

    <button class="btn-reset" id="resetBtn" onclick="resetDiff()" disabled>
      重置
    </button>
  </div>

  <div class="status-box" id="logArea">
    点击「初始化」开始
  </div>

</div>

<script>

const oldChildren = ['A', 'B', 'C', 'D']
const newChildren = ['D', 'A', 'C', 'E', 'B']

let oldStartIdx
let oldEndIdx
let newStartIdx
let newEndIdx

let ops = []

function renderCells() {
  const oldEl = document.getElementById('oldCells')
  const newEl = document.getElementById('newCells')

  oldEl.innerHTML = oldChildren.map((item, i) => {
    let cls = 'cell'
    if (i === oldStartIdx) cls += ' start'
    if (i === oldEndIdx) cls += ' end'
    if (i < oldStartIdx || i > oldEndIdx) cls += ' removed'

    return `
      <div class="${cls}">
        ${item}
        <span class="idx">${i}</span>
      </div>
    `
  }).join('')

  newEl.innerHTML = newChildren.map((item, i) => {
    let cls = 'cell'
    if (i === newStartIdx) cls += ' start'
    if (i === newEndIdx) cls += ' end'
    if (i < newStartIdx || i > newEndIdx) cls += ' removed'

    return `
      <div class="${cls}">
        ${item}
        <span class="idx">${i}</span>
      </div>
    `
  }).join('')
}

function renderOps() {
  const el = document.getElementById('opsList')

  if (ops.length === 0) {
    el.innerHTML = `<div style="color:#5e8a76">（暂无操作）</div>`
    return
  }

  el.innerHTML = ops.map(op => {
    return `
      <div class="op ${op.type}">
        ${op.msg}
      </div>
    `
  }).join('')
}

function renderCompare(msg) {
  document.getElementById('compareBox').innerHTML = msg
}

function patchStep() {
  if (
    oldStartIdx > oldEndIdx ||
    newStartIdx > newEndIdx
  ) {
    // ① 指针越界 → while 循环结束
    // Scope > Script: oldStartIdx > oldEndIdx 或 newStartIdx > newEndIdx
    // 进入剩余节点处理阶段
    debugger

    handleRemaining()
    return false
  }

  const oldS = oldChildren[oldStartIdx]
  const oldE = oldChildren[oldEndIdx]
  const newS = newChildren[newStartIdx]
  const newE = newChildren[newEndIdx]

  renderCompare(`
    oldStart = ${oldS}<br>
    oldEnd = ${oldE}<br>
    newStart = ${newS}<br>
    newEnd = ${newE}
  `)

  /* 1. 头-头 */
  if (oldS === newS) {
    ops.push({
      type: 'none',
      msg: `头-头匹配：${oldS} 不移动`
    })

    oldStartIdx++
    newStartIdx++

    // ② 头-头匹配
    // Scope > Local: oldS === newS，两指针同时右移，节点不需要移动
    debugger

    renderCells()
    renderOps()
    return true
  }

  /* 2. 尾-尾 */
  if (oldE === newE) {
    ops.push({
      type: 'none',
      msg: `尾-尾匹配：${oldE} 不移动`
    })

    oldEndIdx--
    newEndIdx--

    // ③ 尾-尾匹配
    // Scope > Local: oldE === newE，两指针同时左移，节点不需要移动
    debugger

    renderCells()
    renderOps()
    return true
  }

  /* 3. 头-尾 */
  if (oldS === newE) {
    ops.push({
      type: 'move',
      msg: `移动 ${oldS} 到尾部`
    })

    oldStartIdx++
    newEndIdx--

    // ④ 头-尾匹配
    // Scope > Local: oldS === newE，旧头部移到尾部位置
    debugger

    renderCells()
    renderOps()
    return true
  }

  /* 4. 尾-头 */
  if (oldE === newS) {
    ops.push({
      type: 'move',
      msg: `移动 ${oldE} 到头部`
    })

    oldEndIdx--
    newStartIdx++

    // ⑤ 尾-头匹配
    // Scope > Local: oldE === newS，旧尾部移到头部位置
    debugger

    renderCells()
    renderOps()
    return true
  }

  /* 5. 查找复用 */
  const idxInOld = oldChildren.findIndex(
    (item, i) => {
      return (
        i >= oldStartIdx &&
        i <= oldEndIdx &&
        item === newS
      )
    }
  )

  if (idxInOld > -1) {
    ops.push({
      type: 'move',
      msg: `复用 ${newS}（旧索引 ${idxInOld}）`
    })

    // ⑥ 找到可复用的旧节点
    // Scope > Local: idxInOld = 在旧 children 中的索引，newS 被移动复用
    debugger

  } else {
    ops.push({
      type: 'add',
      msg: `新增节点 ${newS}`
    })

    // ⑦ 旧中没有此节点 → 新增
    // Scope > Local: idxInOld = -1，newS 是全新节点
    debugger
  }

  newStartIdx++

  renderCells()
  renderOps()
  return true
}

function handleRemaining() {
  if (oldStartIdx > oldEndIdx) {
    for (let i = newStartIdx; i <= newEndIdx; i++) {
      ops.push({
        type: 'add',
        msg: `新增节点 ${newChildren[i]}`
      })
    }

    // ⑧ 旧节点用完 → 新增剩余节点
    // Scope > Script: newStartIdx 到 newEndIdx 之间的节点都是新增的
    // 例如节点 E 就是这个阶段被添加的
    debugger

  } else if (newStartIdx > newEndIdx) {
    for (let i = oldStartIdx; i <= oldEndIdx; i++) {
      ops.push({
        type: 'remove',
        msg: `删除节点 ${oldChildren[i]}`
      })
    }

    // ⑨ 新节点用完 → 删除多余旧节点
    // Scope > Script: oldStartIdx 到 oldEndIdx 之间的节点都需要删除
    debugger
  }

  renderOps()
  renderCompare('✓ Diff 完成')

  document.getElementById('stepBtn').disabled = true
  document.getElementById('autoBtn').disabled = true
}

function setup() {
  document.getElementById('setupBtn').disabled = true

  oldStartIdx = 0
  oldEndIdx = oldChildren.length - 1

  newStartIdx = 0
  newEndIdx = newChildren.length - 1

  ops = []

  renderCells()
  renderOps()

  renderCompare(`
    旧 children：A B C D<br>
    新 children：D A C E B
  `)

  // ⑩ 初始化完成
  // Scope > Script: oldStartIdx=0, oldEndIdx=3, newStartIdx=0, newEndIdx=4
  debugger

  document.getElementById('stepBtn').disabled = false
  document.getElementById('autoBtn').disabled = false
  document.getElementById('resetBtn').disabled = false

  log('Diff 初始化完成')
}

function diffStep() {
  // ⑪ 手动单步执行
  // 每点一次执行一轮 while，看指针和操作变化
  debugger

  const ok = patchStep()

  if (ok) {
    log('执行一步 Diff')
  } else {
    log('Diff 完成')
  }
}

function diffAll() {
  // ⑫ 自动执行全部
  // 一次性跑完所有 while 循环，看完整 Diff 流程
  debugger

  document.getElementById('stepBtn').disabled = true
  document.getElementById('autoBtn').disabled = true

  while (patchStep()) {}

  log('全部 Diff 执行完成')
}

function resetDiff() {
  // ⑬ 重置
  // 恢复初始状态，重新开始
  debugger

  document.getElementById('setupBtn').disabled = false
  setup()
  log('已重置')
}

function log(msg) {
  const area = document.getElementById('logArea')
  const time = new Date().toLocaleTimeString()
  area.innerHTML =
    `[${time}] ${msg}<br>` +
    area.innerHTML
}

</script>

</body>
</html>
