<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>手写Vue3调度系统（Debugger版）</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Noto Sans SC', system-ui, -apple-system, sans-serif;
      background: #070b09;
      color: #d0e4da;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 20px;
    }
    .box {
      background: #0d1612;
      border: 1px solid #1a2e25;
      border-radius: 12px;
      padding: 40px 48px;
      text-align: center;
      max-width: 560px;
      width: 100%;
    }
    .box h1 {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 6px;
      color: #d0e4da;
    }
    .box h1 small {
      display: block;
      font-size: 0.72rem;
      font-weight: 400;
      color: #5e8a76;
      margin-top: 6px;
    }
    .num-display {
      font-size: 3.5rem;
      font-weight: 900;
      font-family: 'JetBrains Mono', monospace;
      color: #10b981;
      margin: 20px 0;
    }
    .stat-row {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin: 16px 0;
    }
    .stat-item {
      background: #0a100d;
      border: 1px solid #1a2e25;
      border-radius: 8px;
      padding: 10px 18px;
      min-width: 100px;
    }
    .stat-label { font-size: 0.68rem; color: #5e8a76; }
    .stat-val {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.2rem;
      font-weight: 700;
      margin-top: 2px;
    }
    .stat-val.bad { color: #ef4444; }
    .stat-val.good { color: #10b981; }
    .btn-group {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin: 20px 0;
      flex-wrap: wrap;
    }
    .btn {
      padding: 10px 20px;
      font-size: 0.85rem;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
      color: white;
    }
    .btn-setup { background: linear-gradient(135deg, #6b7280, #9ca3af); }
    .btn-setup:hover { box-shadow: 0 4px 20px rgba(156, 163, 175, 0.35); transform: translateY(-1px); }
    .btn-sync { background: linear-gradient(135deg, #059669, #10b981); box-shadow: 0 2px 12px rgba(16, 185, 129, 0.2); }
    .btn-sync:hover { box-shadow: 0 4px 20px rgba(16, 185, 129, 0.35); transform: translateY(-1px); }
    .btn-async { background: linear-gradient(135deg, #2563eb, #60a5fa); box-shadow: 0 2px 12px rgba(96, 165, 250, 0.2); }
    .btn-async:hover { box-shadow: 0 4px 20px rgba(96, 165, 250, 0.35); transform: translateY(-1px); }
    .btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none !important; }
    .tip-box {
      background: #0a100d;
      border: 1px solid #1a2e25;
      border-radius: 8px;
      padding: 16px 20px;
      margin-top: 20px;
      text-align: left;
      line-height: 1.9;
    }
    .tip-box p { font-size: 0.78rem; color: #5e8a76; }
    .tip-box strong { color: #d0e4da; }
    kbd {
      background: rgba(94, 138, 118, 0.15);
      border: 1px solid #1a2e25;
      border-radius: 3px;
      padding: 1px 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      color: #10b981;
    }
    code { color: #60a5fa; font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body>
  <div class="box">
    <h1>
      Vue 调度系统 Debugger
      <small>先打开 F12 → 点"初始化"开始调试</small>
    </h1>
    <div class="num-display" id="num">0</div>
    <div class="stat-row">
      <div class="stat-item">
        <div class="stat-label">无调度器（同步）</div>
        <div class="stat-val bad" id="syncCount">0</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">有调度器（异步）</div>
        <div class="stat-val good" id="asyncCount">0</div>
      </div>
    </div>
    <div class="btn-group">
      <button class="btn btn-setup" id="setupBtn" onclick="setup()">1. 初始化系统</button>
      <button class="btn btn-sync" id="syncBtn" onclick="changeSync()" disabled>2. 改 3 次（无调度器）</button>
      <button class="btn btn-async" id="asyncBtn" onclick="changeAsync()" disabled>3. 改 3 次（有调度器）</button>
    </div>
    <div class="tip-box">
      <strong>使用方式：</strong>
      <p>1. 按 <kbd>F12</kbd> → Sources 面板</p>
      <p>2. 点 <strong>「初始化系统」</strong> → 建立响应式系统和调度器</p>
      <p>3. 两个按钮对比：无调度器改 3 次渲染 3 次 vs 有调度器改 3 次只渲染 1 次</p>
      <p>4. 步进观察 trigger 中的 <code>scheduler</code> 分支判断</p>
    </div>
  </div>

<script>
/* ===== 基础响应式系统 ===== */
let activeEffect = null
const bucket = new Map()
let state = null
let syncRenderCount = 0
let asyncRenderCount = 0

function effect(fn, options = {}) {
  const effectFn = () => {
    debugger // effectFn 执行：activeEffect 指向自身
    activeEffect = effectFn
    fn()
  }
  effectFn.options = options
  debugger // options 已挂载
  effectFn()
}

function track(target, key) {
  if (!activeEffect) return
  let depsMap = bucket.get(target)
  if (!depsMap) { depsMap = new Map(); bucket.set(target, depsMap) }
  let deps = depsMap.get(key)
  if (!deps) { deps = new Set(); depsMap.set(key, deps) }
  deps.add(activeEffect)
}

/*
|--------------------------------------------------------------------------
| trigger — 判断 scheduler 决定执行路径
|--------------------------------------------------------------------------
*/
function trigger(target, key) {
  const depsMap = bucket.get(target)
  if (!depsMap) return
  const effects = depsMap.get(key)
  effects && effects.forEach(fn => {
    debugger // trigger！看看 fn.options.scheduler

    if (fn.options.scheduler) {
      debugger // 有 scheduler → 交给调度器！
      fn.options.scheduler(fn)
    } else {
      debugger // 无 scheduler → 同步执行
      fn()
    }
  })
}

function reactive(data) {
  return new Proxy(data, {
    get(target, key) {
      track(target, key)
      return target[key]
    },
    set(target, key, val) {
      target[key] = val
      trigger(target, key)
      return true
    }
  })
}

/* ===== 调度器 ===== */
const jobQueue = new Set()
const p = Promise.resolve()

function flushJob() {
  debugger // 微任务触发：队列中有几个任务？
  if (jobQueue.size) {
    const jobs = [...jobQueue]
    jobQueue.clear()
    debugger // 依次执行（实际只有 1 个，去重了）
    jobs.forEach(fn => fn())
  }
}

function queueJob(fn) {
  debugger // queueJob：effectFn 入队
  jobQueue.add(fn)
  debugger // 已加入 Set（重复会被去重）
  p.then(flushJob)
  debugger // 微任务已注册
}

/* ===== 初始化 ===== */
function setup() {
  document.getElementById('setupBtn').disabled = true

  state = reactive({ count: 0 })

  // 无调度器的 effect
  effect(() => {
    document.getElementById('num').innerText = state.count
    syncRenderCount++
    document.getElementById('syncCount').innerText = syncRenderCount
  })

  // 有调度器的 effect
  effect(() => {
    document.getElementById('num').innerText = state.count
    asyncRenderCount++
    document.getElementById('asyncCount').innerText = asyncRenderCount
  }, { scheduler: queueJob })

  document.getElementById('syncBtn').disabled = false
  document.getElementById('asyncBtn').disabled = false
}

/* ===== 无调度器：连续改 3 次 ===== */
function changeSync() {
  state.count++
  state.count++
  state.count++
  // ↑ 每次 ++ 都触发 trigger → 同步执行 effect → 渲染 3 次
}

/* ===== 有调度器：连续改 3 次 ===== */
function changeAsync() {
  state.count++
  // ↑ 第 1 次 → trigger → 有 scheduler → queueJob → 入队

  state.count++
  // ↑ 第 2 次 → trigger → queueJob → Set 去重，不入队

  state.count++
  // ↑ 第 3 次 → 同上，被去重
  // 队列中只有 1 个 effectFn，微任务时只执行 1 次
  // 放行 F8 看 flushJob 执行
}
</script>
</body>
</html>
