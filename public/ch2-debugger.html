<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vue 调度系统（Debugger版）</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      background: #070b09;
      color: #d0e4da;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 40px;
    }
    .box {
      background: #0d1612;
      border: 1px solid #1a2e25;
      border-radius: 12px;
      padding: 40px;
      width: 560px;
      text-align: center;
    }
    .num-display {
      font-size: 3rem;
      font-weight: 900;
      color: #10b981;
      margin: 20px 0;
      font-family: monospace;
    }
    .stat-row {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 20px 0;
    }
    .stat {
      background: #0a100d;
      border: 1px solid #1a2e25;
      padding: 10px 16px;
      border-radius: 8px;
      min-width: 120px;
    }
    .label { font-size: 12px; color: #5e8a76; }
    .val { font-size: 20px; font-weight: 700; }
    .bad { color: #ef4444; }
    .good { color: #10b981; }

    button {
      margin: 8px;
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      color: white;
    }
    .sync { background: #ef4444; }
    .async { background: #2563eb; }
    .init { background: #6b7280; }

    button:disabled { opacity: 0.4; }
  </style>
</head>

<body>
<div class="box">
  <h1>Vue 调度系统 Debugger</h1>

  <div class="num-display" id="num">0</div>

  <div class="stat-row">
    <div class="stat">
      <div class="label">同步渲染</div>
      <div class="val bad" id="syncCount">0</div>
    </div>

    <div class="stat">
      <div class="label">调度器渲染</div>
      <div class="val good" id="asyncCount">0</div>
    </div>
  </div>

  <button class="init" id="setupBtn" onclick="setup()">初始化</button>
  <button class="sync" id="syncBtn" onclick="changeSync()" disabled>同步 x3</button>
  <button class="async" id="asyncBtn" onclick="changeAsync()" disabled>调度器 x3</button>
</div>

<script>

/* ================= 响应式基础 ================= */

let activeEffect = null
const bucket = new Map()
let state = null

let syncRenderCount = 0
let asyncRenderCount = 0

function effect(fn, options = {}) {
  const effectFn = () => {

    // ① effect 执行开始 → 【观察】activeEffect 被赋值为 effectFn，然后执行 fn()
    debugger

    activeEffect = effectFn

    fn()

    activeEffect = null

    // ② effect 执行结束 → 【观察】activeEffect 已置空
    debugger
  }

  effectFn.options = options
  effectFn()
}

/* track：依赖收集（get阶段） */
function track(target, key) {
  if (!activeEffect) return

  let depsMap = bucket.get(target)
  if (!depsMap) {
    depsMap = new Map()
    bucket.set(target, depsMap)
  }

  let deps = depsMap.get(key)
  if (!deps) {
    deps = new Set()
    depsMap.set(key, deps)
  }

  deps.add(activeEffect)
}

/* trigger：派发更新（set阶段） */
function trigger(target, key) {
  const depsMap = bucket.get(target)
  if (!depsMap) return

  const effects = depsMap.get(key)
  if (!effects) return

  effects.forEach(fn => {

    // ③ trigger：准备执行 effect → 【观察】看 fn.options.scheduler 是否存在
    debugger

    if (fn.options.scheduler) {

      // ④ 有调度器 → 进入 queueJob → 【观察】不走直接执行，而是交给调度器
      debugger
      fn.options.scheduler(fn)

    } else {

      // ⑤ 无调度器 → 直接同步执行 → 【观察】同步 effect 立即执行 fn()
      debugger
      fn()
    }
  })
}

/* ================= Proxy ================= */

function reactive(data) {
  return new Proxy(data, {
    get(target, key) {
      track(target, key)
      return target[key]
    },
    set(target, key, val) {
      target[key] = val
      trigger(target, key)
      return true
    }
  })
}

/* ================= 调度器 ================= */

const jobQueue = new Set()
const p = Promise.resolve()

function flushJob() {

  // ⑥ 微任务开始执行 → 【观察】jobQueue 中的 job 被批量执行（页面只更新一次）
  debugger

  const jobs = [...jobQueue]
  jobQueue.clear()

  jobs.forEach(fn => {
    fn()
  })
}

function queueJob(fn) {

  // ⑦ job 入队 → 【观察】jobQueue.add(fn)，Set 自动去重，多次触发只保留一个
  debugger

  jobQueue.add(fn)

  // ⑧ 只注册一次微任务 → 【观察】p.then(flushJob)，同一 tick 多次 trigger 只注册一次
  p.then(flushJob)
}

/* ================= 初始化 ================= */

function setup() {
  // → 【观察】创建 reactive state，注册两个 effect（一个同步、一个带 scheduler 异步）
  debugger

  document.getElementById('setupBtn').disabled = true

  state = reactive({ count: 0 })

  /* 同步 effect */
  effect(() => {
    document.getElementById('num').innerText = state.count
    syncRenderCount++
    document.getElementById('syncCount').innerText = syncRenderCount
  })

  /* 异步 effect（带 scheduler） */
  effect(() => {
    document.getElementById('num').innerText = state.count
    asyncRenderCount++
    document.getElementById('asyncCount').innerText = asyncRenderCount
  }, {
    scheduler: queueJob
  })

  document.getElementById('syncBtn').disabled = false
  document.getElementById('asyncBtn').disabled = false
}

/* ================= 对比测试 ================= */

function changeSync() {

  // 【观察】每次 state.count++ 都立即 trigger → 同步 effect 执行 3 次（同步渲染 +3）
  debugger

  state.count++
  state.count++
  state.count++
}

function changeAsync() {

  // 【观察】3 次 trigger 但 scheduler 去重 → 只入队 1 次 → microtask 只渲染 1 次
  debugger

  state.count++
  state.count++
  state.count++
}

</script>
</body>
</html>
