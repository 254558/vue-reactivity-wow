<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vue 调度系统（Debugger版）</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      background: #070b09;
      color: #d0e4da;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 40px;
    }
    .box {
      background: #0d1612;
      border: 1px solid #1a2e25;
      border-radius: 12px;
      padding: 40px;
      width: 560px;
      text-align: center;
    }
    .num-display {
      font-size: 3rem;
      font-weight: 900;
      color: #10b981;
      margin: 20px 0;
      font-family: monospace;
    }
    .stat-row {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 20px 0;
    }
    .stat {
      background: #0a100d;
      border: 1px solid #1a2e25;
      padding: 10px 16px;
      border-radius: 8px;
      min-width: 120px;
    }
    .label { font-size: 12px; color: #5e8a76; }
    .val { font-size: 20px; font-weight: 700; }
    .bad { color: #ef4444; }
    .good { color: #10b981; }

    button {
      margin: 8px;
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      color: white;
    }
    .sync { background: #ef4444; }
    .async { background: #2563eb; }
    .init { background: #6b7280; }

    button:disabled { opacity: 0.4; }
  </style>
</head>

<body>
<div class="box">
  <h1>Vue 调度系统 Debugger</h1>

  <div class="num-display" id="num">0</div>

  <div class="stat-row">
    <div class="stat">
      <div class="label">同步渲染</div>
      <div class="val bad" id="syncCount">0</div>
    </div>

    <div class="stat">
      <div class="label">调度器渲染</div>
      <div class="val good" id="asyncCount">0</div>
    </div>
  </div>

  <button class="init" id="setupBtn" onclick="setup()">初始化</button>
  <button class="sync" id="syncBtn" onclick="changeSync()" disabled>同步 x3</button>
  <button class="async" id="asyncBtn" onclick="changeAsync()" disabled>调度器 x3</button>
</div>

<script>

let activeEffect = null
const bucket = new Map()
let state = null

let syncRenderCount = 0
let asyncRenderCount = 0

function effect(fn, options = {}) {
  const effectFn = () => {
    activeEffect = effectFn
    fn()

    // ① effect 执行完毕
    // Scope > Script: activeEffect 仍指向 effectFn（还没清空）
    debugger

    activeEffect = null
  }

  effectFn.options = options
  effectFn()
}

function track(target, key) {
  if (!activeEffect) return

  let depsMap = bucket.get(target)
  if (!depsMap) {
    depsMap = new Map()
    bucket.set(target, depsMap)
  }

  let deps = depsMap.get(key)
  if (!deps) {
    deps = new Set()
    depsMap.set(key, deps)
  }

  deps.add(activeEffect)
}

function trigger(target, key) {
  const depsMap = bucket.get(target)
  if (!depsMap) return

  const effects = depsMap.get(key)
  if (!effects) return

  effects.forEach(fn => {
    // ② trigger 判断执行方式
    // Scope > Local: fn = 当前 effect，展开 fn.options 看 scheduler 是否存在
    debugger

    if (fn.options.scheduler) {
      // ③ 有 scheduler → 走异步调度分支
      // Scope > Local: fn.options.scheduler = queueJob
      // fn 不会立即执行，而是交给 scheduler 排队
      debugger

      fn.options.scheduler(fn)
    } else {
      // ④ 无 scheduler → 同步执行
      // Scope > Local: fn.options 中没有 scheduler
      // fn 立即执行，页面马上更新
      debugger

      fn()
    }
  })
}

function reactive(data) {
  return new Proxy(data, {
    get(target, key) {
      track(target, key)
      return target[key]
    },
    set(target, key, val) {
      target[key] = val
      trigger(target, key)
      return true
    }
  })
}

const jobQueue = new Set()
const p = Promise.resolve()
let isFlushing = false

function queueJob(fn) {
  jobQueue.add(fn)

  // ⑤ job 已入队
  // Scope > Script: 展开 jobQueue > [[Entries]]，里面有 1 个 fn
  // Set 自动去重：同一个 fn 多次 add 只保留一个
  debugger

  if (!isFlushing) {
    isFlushing = true
    p.then(flushJob)
  }

  // ⑥ 微任务已注册
  // Scope > Script: isFlushing = true，后续 trigger 不会重复注册 flushJob
  debugger
}

function flushJob() {
  const jobs = [...jobQueue]
  jobQueue.clear()
  isFlushing = false

  // ⑦ 微任务开始批量执行
  // Scope > Local: jobs = 从队列中取出的 effect 数组
  // 无论 trigger 了几次，jobQueue 去重后只会有 1 个 job → 页面只更新 1 次
  debugger

  jobs.forEach(fn => {
    fn()
  })
}

function setup() {
  document.getElementById('setupBtn').disabled = true

  state = reactive({ count: 0 })

  effect(() => {
    document.getElementById('num').innerText = state.count
    syncRenderCount++
    document.getElementById('syncCount').innerText = syncRenderCount
  })

  effect(() => {
    document.getElementById('num').innerText = state.count
    asyncRenderCount++
    document.getElementById('asyncCount').innerText = asyncRenderCount
  }, {
    scheduler: queueJob
  })

  // ⑧ 初始化完成
  // Scope > Script: state = Proxy{count:0}
  // bucket 中 "count" 对应的 Set 里有 2 个 effect（1 个同步、1 个带 scheduler）
  debugger

  document.getElementById('syncBtn').disabled = false
  document.getElementById('asyncBtn').disabled = false
}

function changeSync() {
  // ⑨ 同步修改 x3
  // 按 F8 继续：3 次 state.count++ → 3 次 trigger → 同步 effect 执行 3 次
  // 观察页面上「同步渲染」计数 +3
  debugger

  state.count++
  state.count++
  state.count++
}

function changeAsync() {
  // ⑩ 调度器修改 x3
  // 按 F8 继续：3 次 state.count++ → 3 次 trigger → 但 scheduler 去重
  // jobQueue 只有 1 个 job → 微任务只渲染 1 次
  // 观察页面上「调度器渲染」计数只 +1
  debugger

  state.count++
  state.count++
  state.count++
}

</script>
</body>
</html>
